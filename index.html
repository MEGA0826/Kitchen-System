<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen MEP — 212 Nooch Richti</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen MEP">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#0f0f0d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").then(reg => {
        // Check for updates every time the page loads
        reg.update();
        // When a new SW is waiting, reload to activate it
        reg.addEventListener("updatefound", () => {
          const newSW = reg.installing;
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              // New version available - reload silently
              window.location.reload();
            }
          });
        });
      });
      // Listen for sync complete messages from SW
      navigator.serviceWorker.addEventListener("message", e => {
        if (e.data?.type === "SYNC_COMPLETE")
      });
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0d;
      --surface:   #1a1a16;
      --surface2:  #242420;
      --border:    rgba(255,255,255,0.08);
      --border2:   rgba(255,255,255,0.14);
      --text:      #f0ede6;
      --muted:     #888880;
      --amber:     #e8a020;
      --amber-dim: rgba(232,160,32,0.12);
      --amber-brd: rgba(232,160,32,0.25);
      --green:     #5dca8a;
      --green-dim: rgba(93,202,138,0.12);
      --green-brd: rgba(93,202,138,0.20);
      --red:       #e86050;
      --red-dim:   rgba(232,96,80,0.12);
      --red-brd:   rgba(232,96,80,0.20);
      --blue:      #60a8e8;
      --blue-dim:  rgba(96,168,232,0.12);
      --blue-brd:  rgba(96,168,232,0.22);
      --gray-dim:  rgba(255,255,255,0.06);
      --radius:    14px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* -- Page: fills screen, no scroll -- */
    .page {
      height: 100vh; height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* -- Header -- */
    .header {
      padding: 12px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-name {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      line-height: 1;
    }
    .brand-name em { font-style: italic; color: var(--amber); }
    .brand-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dashboard-link {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 9px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      transition: color .15s, border-color .15s;
    }
    .dashboard-link:hover { color: var(--amber); border-color: var(--amber); }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--green);
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* -- Product Card -- */
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      flex-shrink: 0;
      animation: slideUp .3s ease both;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }
    /* Top row: text left, image right — image never overlaps text */
    .product-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .product-info {
      flex: 1;
      min-width: 0; /* allows text-overflow to work */
    }
    .product-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .product-name {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-code {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 1px;
    }
    /* Image — fixed size beside text, never absolute */
    .product-img {
      width: 88px;
      height: 66px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .product-img-ph {
      width: 88px;
      height: 66px;
      border-radius: 8px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      opacity: .25;
      flex-shrink: 0;
    }

    /* -- MEP Status rows -- */
    .mep-status {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mep-row {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
    }
    .mep-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .mep-dot.green { background: var(--green); }
    .mep-dot.amber { background: var(--amber); }
    .mep-dot.red   { background: var(--red); }
    .mep-row-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mep-row-label strong {
      color: var(--text);
      font-weight: 500;
    }
    .mep-row-label.full strong { color: var(--green); }

    /* Full MEP list message inside actions grid */
    .mep-full-msg {
      display: none;
      grid-column: 1 / -1;
      background: var(--green-dim);
      border: 1px solid var(--green-brd);
      color: var(--green);
      border-radius: var(--radius);
      padding: 10px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .mep-full-msg.visible { display: block; }

    /* -- Worker Select + PIN -- */
    .field-wrap { flex-shrink: 0; animation: slideUp .3s .07s ease both; }


    /* -- Action Buttons - compact row -- */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
      animation: slideUp .3s .14s ease both;
    }
    .btn-row { display: flex; gap: 7px; }
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      transition: transform .1s, opacity .12s;
      flex: 1;
    }
    .btn:active { transform: scale(0.97); }
    .btn-icon  { font-size: 16px; line-height: 1; flex-shrink:0; }
    .btn-label { font-size: 13px; letter-spacing: 0.8px; }

    .btn-done  { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-brd); }
    .btn-used  { background: var(--blue-dim);  color: var(--blue);  border: 1px solid var(--blue-brd); }
    .btn-waste { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red-brd); }

    .btn-undo {
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber-brd);
      border-radius: var(--radius-sm);
      padding: 0 16px;
      height: 42px;
      animation: pulse 1s ease-in-out infinite;
      width: 100%;
    }
    .btn-undo .btn-icon { font-size: 15px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    /* Inactive state for all action buttons */
    .btn.inactive {
      opacity: 0.28;
      pointer-events: none;
    }

    /* -- Offline queue badge -- */
    .offline-badge {
      display: none;
      position: fixed;
      top: 12px; right: 12px;
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber-brd);
      border-radius: 20px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      z-index: 50;
      cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
    }
    .offline-badge.visible { display: block; }

    /* -- Status row (feedback + undo share same slot) -- */
    .status-row {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .feedback-inner {
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border-radius: 40px;
      display: none;
      width: 100%;
      justify-content: center;
    }
    .feedback-inner.visible { display: inline-flex; align-items: center; gap: 6px; }
    .feedback-inner.success { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-brd); }
    .feedback-inner.error   { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red-brd); }
    .feedback-inner.info    { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber-brd); }

    /* -- Over-produce popup -- */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .popup-overlay.visible { display: flex; }
    .popup-box {
      background: var(--surface);
      border: 1px solid var(--red-brd);
      border-radius: var(--radius);
      padding: 24px 22px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      animation: slideUp .25s ease both;
    }
    .popup-icon { font-size: 32px; margin-bottom: 10px; }
    .popup-title { font-family: 'Instrument Serif', serif; font-size: 22px; color: var(--red); margin-bottom: 6px; }
    .popup-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .popup-btn { width: 100%; padding: 12px; background: var(--red-dim); color: var(--red); border: 1px solid var(--red-brd); border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity .15s; }
    .popup-btn:active { opacity: 0.7; }

    /* -- Skeleton -- */
    .skeleton {
      height: 26px; width: 55%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--surface2) 25%, #2e2e28 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    /* -- QRbot-style full-screen scanner -- */
    .scan-home {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    /* Video fills everything */
    .scan-home-video-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    #scanner-video-inline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Dark vignette overlay - 4 panels around transparent box */
    .scan-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    /* The centred transparent scan frame */
    .scan-frame-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      z-index: 3;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.52);
      border-radius: 12px;
    }
    /* Corner brackets */
    .scan-c {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #e8a020;
      border-style: solid;
    }
    .scan-c.tl { top:-2px;  left:-2px;  border-width:4px 0 0 4px; border-radius:8px 0 0 0; }
    .scan-c.tr { top:-2px;  right:-2px; border-width:4px 4px 0 0; border-radius:0 8px 0 0; }
    .scan-c.bl { bottom:-2px; left:-2px;  border-width:0 0 4px 4px; border-radius:0 0 0 8px; }
    .scan-c.br { bottom:-2px; right:-2px; border-width:0 4px 4px 0; border-radius:0 0 8px 0; }
    /* Animated scan line inside frame */
    .scan-line {
      position: absolute;
      left: 4px; right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e8a020, transparent);
      box-shadow: 0 0 6px 2px rgba(232,160,32,0.6);
      border-radius: 2px;
      animation: scanmove 2s ease-in-out infinite;
    }
    @keyframes scanmove {
      0%   { top: 4px;  opacity:0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: calc(100% - 6px); opacity:0; }
    }
    /* Hint below frame */
    .scan-hint-text {
      position: absolute;
      top: calc(50% + 120px);
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 4;
      pointer-events: none;
    }
    /* Top bar */
    .scan-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      padding: 0 16px;
    }
    .scan-app-name {
      font-family: 'Instrument Serif', serif;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    /* Zoom slider */
    .scan-zoom-wrap {
      position: absolute;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.45);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .scan-zoom-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      min-width: 30px;
      text-align: center;
    }
    #zoomSlider {
      -webkit-appearance: none;
      width: 140px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      outline: none;
    }
    #zoomSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #e8a020;
      cursor: pointer;
      border: 2px solid #fff;
    }
    /* Bottom toolbar */
    .scan-toolbar {
      height: 96px;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 5;
    }
    .scan-tb-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 12px;
      transition: background .15s;
      min-width: 60px;
    }
    .scan-tb-btn:active { background: rgba(255,255,255,0.12); }
    .scan-tb-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      transition: background .15s, border-color .15s;
    }
    .scan-tb-icon.active { background: #e8a020; border-color: #e8a020; }
    .scan-tb-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    /* Retry button */
    .btn-scan-camera {
      position: absolute;
      bottom: 110px;
      left: 50%; transform: translateX(-50%);
      z-index: 6;
      padding: 12px 28px;
      background: rgba(232,160,32,0.9);
      color: #000;
      border: none;
      border-radius: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scan-msg {
      position: absolute;
      top: 64px; left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,100,80,0.9);
      z-index: 6;
      padding: 0 24px;
    }
    /* Hidden file input for gallery */
    #galleryInput { display: none; }
    .btn-scan-camera {
      padding: 14px;
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber-brd);
      border-radius: var(--radius);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: opacity .15s;
    }
    .btn-scan-camera:active { opacity: 0.7; }
    .scan-msg { font-size:12px; color:var(--red); text-align:center; min-height:18px; }

    /* -- PIN Pad -- */
    .pin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .pin-name { font-size:13px; color:var(--amber); font-family:'DM Mono',monospace; letter-spacing:0.5px; }
    .pin-dots { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
    .pin-dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--border2); background:transparent; transition:background .1s, border-color .1s; }
    .pin-dot.filled { background:var(--amber); border-color:var(--amber); }
    .pin-dot.error  { background:var(--red);   border-color:var(--red); }
    .pin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .pin-btn { padding:13px 0; background:var(--surface); color:var(--text); border:1px solid var(--border2); border-radius:var(--radius-sm); font-family:'DM Mono',monospace; font-size:18px; font-weight:500; cursor:pointer; transition:background .1s, transform .08s; -webkit-tap-highlight-color:transparent; }
    .pin-btn:active { background:var(--surface2); transform:scale(0.94); }
    .pin-clear { color:var(--muted); font-size:13px; }
    .pin-del   { color:var(--amber); font-size:15px; }
  </style>
</head>
<body>
<div class="page">

  <!-- Offline queue badge -->
  <div class="offline-badge" id="offlineBadge" onclick="retryQueue()" title="Tap to retry pending scans">
     <span id="offlineCount">0</span> pending
  </div>

  <!-- Header -->
  <header class="header">
    <div>
      <div class="brand-name">Kitchen <em>MEP</em></div>
      <div class="brand-sub">212 · Nooch Richti</div>
    </div>
    <div class="header-right">
      <a href="https://mega0826.github.io/Kitchen-System/dashboard.html"
        style="display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-brd);border-radius:var(--radius-sm);font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;text-decoration:none">
        Dashboard
      </a>
      <div class="live-badge"><span class="status-dot"></span>LIVE</div>
    </div>
  </header>

  <!-- Scanner home state - inline camera, no overlay needed -->
  <div class="scan-home" id="scanHome" style="display:none">

    <div class="scan-home-video-wrap">
      <video id="scanner-video-inline" autoplay playsinline muted></video>

      <!-- centred transparent scan frame -->
      <div class="scan-frame-box">
        <div class="scan-c tl"></div>
        <div class="scan-c tr"></div>
        <div class="scan-c bl"></div>
        <div class="scan-c br"></div>
        <div class="scan-line"></div>
      </div>

      <!-- top bar -->
      <div class="scan-topbar">
        <div class="scan-app-name">Kitchen <em style="font-style:italic;color:#e8a020">MEP</em></div>
      </div>

      <!-- hint -->
      <div class="scan-hint-text">Point camera at QR code</div>

      <!-- messages -->
      <div class="scan-msg" id="scanMsg"></div>

      <!-- retry -->
      <button class="btn-scan-camera" id="btnRetry" onclick="startInlineScanner()" style="display:none">
        <span>⟳</span><span>Tap to start camera</span>
      </button>

      <!-- zoom slider - shown only if device supports zoom -->
      <div class="scan-zoom-wrap" id="zoomWrap" style="display:none">
        <span class="scan-zoom-label" style="font-size:16px">−</span>
        <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" oninput="applyZoom(this.value)">
        <span class="scan-zoom-label" style="font-size:16px">+</span>
        <span class="scan-zoom-label" id="zoomLabel">1x</span>
      </div>
    </div>

    <!-- bottom toolbar -->
    <div class="scan-toolbar">
      <button class="scan-tb-btn" onclick="openGallery()">
        <div class="scan-tb-icon">🖼</div>
        <span class="scan-tb-label">Gallery</span>
      </button>
      <button class="scan-tb-btn" id="btnFlash" onclick="toggleFlash()">
        <div class="scan-tb-icon" id="flashIcon">⚡</div>
        <span class="scan-tb-label">Flash</span>
      </button>
      <button class="scan-tb-btn" id="btnToggleCamera" onclick="toggleCamera()">
        <div class="scan-tb-icon">⇄</div>
        <span class="scan-tb-label" id="btnToggleCameraLabel">Front</span>
      </button>
    </div>

    <input type="file" id="galleryInput" accept="image/*" onchange="scanFromGallery(event)">
  </div>

  <!-- Product + Actions screen (shown after scan) -->
  <div id="productScreen" style="display:none;flex:1;display:none;flex-direction:column;gap:8px;overflow:hidden">

    <!-- Product card - compact fixed height -->
    <div class="product-card" id="productCard">
      <div class="product-top">
        <div class="product-info">
          <div class="product-label">Scanned product</div>
          <div class="product-name" id="product"><div class="skeleton"></div></div>
          <div class="product-code" id="productCode"></div>
        </div>
        <img id="productImage" class="product-img" alt="" style="display:none;">
        <div id="imgPlaceholder" class="product-img-ph">🍽</div>
      </div>
      <div class="mep-status" id="mepStatus" style="display:none">
        <div class="mep-row">
          <span class="mep-dot green" id="mepDotDone"></span>
          <span class="mep-row-label" id="mepLabelDone"></span>
        </div>
        <div class="mep-row">
          <span class="mep-dot amber" id="mepDotList"></span>
          <span class="mep-row-label" id="mepLabelList"></span>
        </div>
      </div>
    </div>div>

    <!-- Worker PIN login -->
    <div class="field-wrap" id="workerWrap">
      <label class="field-label" for="worker">Staff member</label>
      <select class="worker-select" id="worker">
        <option value="">-- Select --</option>
      </select>
    </div>

    <!-- Action buttons - fixed heights, never shift layout -->
    <div class="actions" id="actionsWrap">

      <!-- Finish - always full width -->
      <div class="btn-row">
        <button class="btn btn-done" onclick="send('done')">
          <span class="btn-icon">OK</span>
          <span class="btn-label">Finish MEP</span>
        </button>
      </div>

      <!-- Used + Waste - side by side -->
      <div class="btn-row">
        <button class="btn btn-used" id="btnUsed" onclick="send('used')">
          <span class="btn-icon">→</span>
          <span class="btn-label">Used</span>
        </button>
        <button class="btn btn-waste" id="btnWaste" onclick="send('waste')">
          <span class="btn-icon">✕</span>
          <span class="btn-label">Waste</span>
        </button>
      </div>

      <!-- Status row: undo OR feedback message - same height slot -->
      <div class="status-row" id="statusRow">
        <div class="feedback-inner" id="msg"></div>
        <button class="btn btn-undo" id="btnUndo" onclick="undoAction()" style="display:none">
          <span class="btn-icon"><-</span>
          <span class="btn-label" id="undoLabel">Undo (3)</span>
        </button>
      </div>

      <!-- Daily target covered banner -->
      <div class="mep-full-msg" id="mepFullMsg">Daily target covered OK</div>

    </div>
  </div>

</div>

<!-- Over-produce popup -->
<div class="popup-overlay" id="overPopup">
  <div class="popup-box">
    <div class="popup-icon">⚠</div>
    <div class="popup-title">Over Produce!</div>
    <div class="popup-sub" id="overPopupSub">You have finished more than the daily target.</div>
    <button class="popup-btn" onclick="closeOverPopup()">OK - Understood</button>
  </div>
</div>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbynCt3ykTwU7O6e4fdO2yLlyj75WCiL5-7QkP249BTA7MJdbl9AdY3RiBVetEn-dNs0Xg/exec";

  let PRODUCT_MAP = {};
  let CURRENT_CODE = "";

  function showMsg(text, type = "info") {
    const el   = document.getElementById("msg");
    const undo = document.getElementById("btnUndo");
    el.textContent = text;
    el.className   = `feedback-inner visible ${type}`;
    if (undo) undo.style.display = "none";  // hide undo when message shows
  }

  function hideMsg() {
    const el = document.getElementById("msg");
    if (el) el.className = "feedback-inner";
  }

  async function preloadProducts() {
    try {
      const res  = await fetch(`${API_URL}?action=allProducts`, { cache: "force-cache" });
      const data = await res.json();
      PRODUCT_MAP = (!data.error && typeof data === "object" && !Array.isArray(data)) ? data : {};
      // Cache for instant next load
      try { sessionStorage.setItem("productMap", JSON.stringify(PRODUCT_MAP)); } catch(e) {}
    } catch (err) {
      document.getElementById("product").textContent = "Error loading";
    }
  }

  async function preloadWorkers() {
    try {
      const res     = await fetch(`${API_URL}?action=workers`, { cache: "force-cache" });
      const data    = await res.json();
      const select  = document.getElementById("worker");
      const workers = data.workers || [];
      select.innerHTML = "";
      workers.forEach(w => {
        const o = document.createElement("option");
        o.value = o.textContent = w;
        select.appendChild(o);
      });
      const saved = localStorage.getItem("worker") || localStorage.getItem("mep_worker");
      if (saved) select.value = saved;
    } catch (err) {
      console.error("Worker load error:", err);
    }
  }

  // -- MEP status --
  async function loadMepStatus(code) {
    if (!code) return;
    try {
      const res  = await fetch(`${API_URL}?action=mepStatus&code=${encodeURIComponent(code)}`);
      const data = await res.json();
      updateMepUI(data);
    } catch (err) {
      console.error("MEP status error:", err);
    }
  }

  function setUsedWasteState(avail) {
    const noAvail = !avail || Number(avail) < 1;
    // Use id selectors - more reliable than class selectors when display:none parents exist
    const btnUsed  = document.getElementById("btnUsed");
    const btnWaste = document.getElementById("btnWaste");
    [btnUsed, btnWaste].forEach(btn => {
      if (!btn) return;
      if (noAvail) {
        btn.classList.add("inactive");
        btn.style.opacity = "0.28";
        btn.style.pointerEvents = "none";
      } else {
        btn.classList.remove("inactive");
        btn.style.opacity = "";
        btn.style.pointerEvents = "";
      }
    });
  }

  function updateMepUI(data) {
    const status  = document.getElementById("mepStatus");
    const fullMsg = document.getElementById("mepFullMsg");

    // Always update Used/Waste state - even when mepMax is 0
    const _avail = data.available !== undefined ? data.available : (data.doneCount || 0);
    setUsedWasteState(_avail);

    if (!data.mepMax || data.mepMax === 0) {
      status.style.display = "none";
      fullMsg.classList.remove("visible");
      return;
    }

    status.style.display = "flex";

    const gnSize   = data.gnSize   || "";
    const gnWeight = data.gnWeight || 0;

    // inProgress: items in MEP list right now (produce - done)
    const inProg  = data.inProgress !== undefined
      ? data.inProgress
      : Math.max(0, (data.produceCount||0) - (data.doneCount||0));

    // available: finished MEPs still usable (done - waste)
    // Use server field if present, otherwise fall back to doneCount
    const avail   = data.available !== undefined
      ? data.available
      : (data.doneCount || 0);

    const listWt  = gnWeight * inProg;
    const availWt = gnWeight * avail;

    // Row 1 - Available (one compact line)
    const labelDone = document.getElementById("mepLabelDone");
    const dotDone   = document.getElementById("mepDotDone");
    let doneText = `<strong>Available: ${avail}`;
    if (gnSize)   doneText += ` ${gnSize}`;
    if (gnWeight) doneText += ` = ${availWt} kg`;
    doneText += `</strong>`;
    labelDone.innerHTML = doneText;
    dotDone.className   = "mep-dot green";

    // Row 2 - To produce: target - available (or inProg if no target)
    const tagesziel2 = data.tagesziel || 0;
    const toProduce  = tagesziel2 > 0
      ? Math.max(0, tagesziel2 - avail)
      : inProg;
    const toProdWt   = gnWeight * toProduce;
    const labelList  = document.getElementById("mepLabelList");
    const dotList    = document.getElementById("mepDotList");
    let listText = `<strong>To produce: ${toProduce}`;
    if (gnSize)   listText += ` ${gnSize}`;
    if (gnWeight && toProduce > 0) listText += ` = ${toProdWt} kg`;
    listText += `</strong>`;
    labelList.innerHTML = listText;

    // Finish is active when there is work in the MEP list (inProg > 0)
    // Also keep active when toProduce > 0 - items are being made
    const btnDone = document.querySelector(".btn-done");
    if (btnDone) {
      const canFinish = inProg > 0 || toProduce > 0;
      if (canFinish) {
        btnDone.classList.remove("inactive");
        btnDone.title = "";
      } else {
        btnDone.classList.add("inactive");
        btnDone.title = "Nothing in MEP list to finish";
      }
    }

    // Used/Waste state already set above via setUsedWasteState()

    // Remember last known values for optimistic UI
    window._lastAvail  = avail;
    window._lastInProg = inProg;

    // "Daily target covered" only when available has reached the target
    const tagesziel = data.tagesziel || 0;
    const mepMax    = data.mepMax    || 0;
    const targetQty = tagesziel > 0 ? tagesziel : mepMax;
    const covered   = targetQty > 0 && avail >= targetQty;

    if (covered) {
      dotList.className = "mep-dot green";
      labelList.classList.add("full");
      fullMsg.textContent = "Daily target covered OK";
      fullMsg.classList.add("visible");
    } else {
      dotList.className = toProduce > 0 ? "mep-dot amber" : "mep-dot green";
      labelList.classList.remove("full");
      fullMsg.classList.remove("visible");
    }
  }

  function showProduct() {
    CURRENT_CODE = new URLSearchParams(window.location.search).get("code") || "";
    const pd    = PRODUCT_MAP[CURRENT_CODE] || {};
    const name  = pd.name || CURRENT_CODE || "Unknown product";
    const image = pd.image || "";

    document.getElementById("product").textContent = name;
    if (CURRENT_CODE) document.getElementById("productCode").textContent = "CODE · " + CURRENT_CODE;

    const img = document.getElementById("productImage");
    const ph  = document.getElementById("imgPlaceholder");

    if (image) {
      img.onload  = () => { img.style.display = "block"; ph.style.display = "none"; };
      img.onerror = () => { img.style.display = "none";  ph.style.display = "flex"; };
      img.src = image;
    } else {
      img.style.display = "none";
      ph.style.display  = "flex";
    }
  }

  function getCurrentWorker() {
    return document.getElementById("worker")?.value || "";
  }

  let _lastAction  = null;   // last successfully saved action
  let _undoTimer   = null;   // countdown interval
  let _redirectTimer = null; // auto-redirect timeout

  function send(action) {
    const worker = getCurrentWorker();
    if (!worker) { showMsg("Enter your PIN or select staff first", "error"); return; }

    // -- Optimistic UI: update display instantly, confirm from server --
    const p = PRODUCT_MAP[CURRENT_CODE] || {};
    if (p.mepMax) {
      const optimistic = Object.assign({}, p, {
        mepMax      : p.mepMax,
        gnSize      : p.gnSize    || "",
        gnWeight    : p.gnWeight  || 0,
        tagesziel   : p.tagesziel || 0,
        // Estimate new values immediately
        available   : action === "done"  ? ((_lastAvail||0) + 1)
                    : action === "used"  ? Math.max(0, (_lastAvail||0) - 1)
                    : action === "waste" ? Math.max(0, (_lastAvail||0) - 1)
                    : (_lastAvail||0),
        inProgress  : action === "done"  ? Math.max(0, (_lastInProg||0) - 1)
                    : (_lastInProg||0),
        listFull    : false,
        overProduce : false,
        goalMet     : false,
      });
      updateMepUI(optimistic);
    }

    showMsg("Saving...", "info");
    const labels = { done: "MEP Finished OK", waste: "Waste recorded OK", used: "Sent to service OK" };
    const url = `${API_URL}?code=${encodeURIComponent(CURRENT_CODE)}&worker=${encodeURIComponent(worker)}&action=${encodeURIComponent(action)}`;

    fetch(url)
      .then(r => r.json())
      .then(data => {
        if (data.mepMax !== undefined) updateMepUI(data);
        if (data.status === "list_full") {
          showMsg(data.message || "Target already covered", "info");
          return;
        }
        // Build deduction summary if this was a done scan
        const dedMsg = (action === "done" && data.deducted && data.deducted.length > 0)
          ? " | Deducted: " + data.deducted.map(d => d.name + " -" + d.deducted + d.unit + (d.low ? "(LOW)" : "")).join(", ")
          : "";
        const hasLow = data.deducted && data.deducted.some(d => d.low);
        if (data.status === "over_produce") {
          const p = PRODUCT_MAP[CURRENT_CODE] || {};
          showOverPopup(p.name || CURRENT_CODE, data);
          showMsg("MEP Finished OK" + dedMsg, hasLow ? "error" : "success");
          startUndo(action);
          return;
        }
        showMsg((labels[action] || "Saved") + dedMsg + (dedMsg ? "" : " -- tap Undo to reverse"), hasLow ? "error" : "success");
        startUndo(action);
      })
      .catch(async () => {
        // Network failed - save to offline queue
        await queueScan({ code: CURRENT_CODE, worker, action, ts: Date.now() });
        showMsg("Saved offline  - will sync when back online", "info");
        startUndo(action);
        updateBadge();
      });
  }

  function startUndo(action) {
    _lastAction = action;
    clearInterval(_undoTimer);
    clearTimeout(_redirectTimer);

    const btn   = document.getElementById("btnUndo");
    const label = document.getElementById("undoLabel");
    const msg   = document.getElementById("msg");

    // Hide feedback message, show undo in the same slot
    if (msg)   msg.className = "feedback-inner";
    if (btn)   btn.style.display = "flex";   // flex not grid - matches status-row
    let secs = 3;
    if (label) label.textContent = `Undo (${secs})`;

    _undoTimer = setInterval(() => {
      secs--;
      if (label) label.textContent = `Undo (${secs})`;
      if (secs <= 0) {
        clearInterval(_undoTimer);
        btn.style.display = "none";
        _lastAction = null;
        window.location.href = window.location.pathname;
      }
    }, 1000);
  }

  function undoAction() {
    if (!_lastAction) return;
    clearInterval(_undoTimer);
    clearTimeout(_redirectTimer);
    document.getElementById("btnUndo").style.display = "none";

    const worker = document.getElementById("worker").value;
    showMsg("Undoing...", "info");

    fetch(`${API_URL}?action=undoScan&code=${encodeURIComponent(CURRENT_CODE)}&worker=${encodeURIComponent(worker)}&lastAction=${encodeURIComponent(_lastAction)}`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { showMsg("Undo failed: " + data.error, "error"); return; }
        _lastAction = null;
        showMsg("Undone OK", "success");
        // Reload MEP status then return to scanner after short delay
        loadMepStatus(CURRENT_CODE);
        setTimeout(() => {
          window.location.href = window.location.pathname;
        }, 1200);
      })
      .catch(() => showMsg("Network error - undo failed", "error"));
  }

  function showOverPopup(name, data) {
    const gnLabel = data.gnSize ? " " + data.gnSize : "";
    const sub = `${name}: ${data.available}${gnLabel} finished - daily target is ${data.tagesziel}${gnLabel}.`;
    document.getElementById("overPopupSub").textContent = sub;
    document.getElementById("overPopup").classList.add("visible");
  }

  function closeOverPopup() {
    document.getElementById("overPopup").classList.remove("visible");
  }

  function cancelScan() {
    clearInterval(_undoTimer);
    clearTimeout(_redirectTimer);
    const u = document.getElementById("btnUndo");
    if (u) u.style.display = "none";
    window.location.href = window.location.pathname;
  }

  // -- QR Scanner - inline video in page --
  let _scanStream   = null;
  let _scanInterval = null;
  let _cameraFacing = localStorage.getItem("cameraFacing") || "environment";

  function toggleCamera() {
    _cameraFacing = _cameraFacing === "environment" ? "user" : "environment";
    localStorage.setItem("cameraFacing", _cameraFacing);
    stopInlineScanner();
    startInlineScanner();
  }

  function updateToggleLabel() {
    const lbl = document.getElementById("btnToggleCameraLabel");
    if (lbl) lbl.textContent = _cameraFacing === "user" ? "Rear cam" : "Front cam";
  }

  async function startCameraStream() {
    const video = document.getElementById("scanner-video");
    try {
      _scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: _cameraFacing, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = _scanStream;
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        _scanInterval = setInterval(async () => {
          try {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
              const raw = codes[0].rawValue;
              closeScanner();
              handleScannedUrl(raw);
            }
          } catch(e) {}
        }, 300);
      } else {
        closeScanner();
        const code = prompt("Enter product code manually:");
        if (code) handleScannedUrl(code.trim());
      }
    } catch(err) {
      closeScanner();
      showMsg("Camera access denied - check browser permissions", "error");
    }
  }

  function openScanner() { startInlineScanner(); }

  function startInlineScanner() {
    const video = document.getElementById("scanner-video-inline");
    const retry = document.getElementById("btnRetry");
    const msg   = document.getElementById("scanMsg");
    if (!video) return;
    if (msg) msg.textContent = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: _cameraFacing } })
    .then(async stream => {
      _scanStream = stream;
      video.srcObject = stream;
      video.play();

      // Hide retry, update camera label
      if (retry) retry.style.display = "none";
      updateToggleLabel();

      // Wire zoom slider
      try {
        const track = stream.getVideoTracks()[0];
        _zoomTrack  = track;
        const caps  = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) {
          const slider = document.getElementById("zoomSlider");
          const wrap   = document.getElementById("zoomWrap");
          const label  = document.getElementById("zoomLabel");
          if (slider) {
            slider.min   = caps.zoom.min;
            slider.max   = caps.zoom.max;
            slider.step  = (caps.zoom.max - caps.zoom.min) / 50;
            // Default to 2.8x (or max if device doesn't support that high)
            const defaultZoom = Math.min(2.8, caps.zoom.max);
            slider.value = defaultZoom;
            track.applyConstraints({ advanced: [{ zoom: defaultZoom }] }).catch(() => {});
          }
          if (label) label.textContent = Math.min(2.8, caps.zoom.max).toFixed(1) + "x";
          if (wrap)  wrap.style.display = "flex";
        }
      } catch(e) { /* zoom not available */ }

      // Start QR decoding
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        _scanInterval = setInterval(() => {
          if (video.readyState < 2) return;
          detector.detect(video).then(codes => {
            if (codes.length > 0) {
              stopInlineScanner();
              handleScannedUrl(codes[0].rawValue);
            }
          }).catch(() => {});
        }, 300);
      } else {
        loadJsQR(video);
      }
    })
    .catch(err => {
      if (retry) retry.style.display = "flex";
      if (msg) msg.textContent = err.name === "NotAllowedError"
        ? "Camera permission denied - tap Retry"
        : "Camera error: " + err.message;
    });
  }

  function stopInlineScanner() {
    clearInterval(_scanInterval);
    _flashOn = false;
    if (_scanStream) { _scanStream.getTracks().forEach(t => t.stop()); _scanStream = null; }
  }

  // -- Flashlight --
  let _flashOn = false;
  async function toggleFlash() {
    if (!_scanStream) return;
    const track = _scanStream.getVideoTracks()[0];
    if (!track) return;
    try {
      const caps = track.getCapabilities();
      if (!caps.torch) { 
        document.getElementById("scanMsg").textContent = "Flashlight not supported on this device";
        setTimeout(() => { document.getElementById("scanMsg").textContent = ""; }, 2000);
        return;
      }
      _flashOn = !_flashOn;
      await track.applyConstraints({ advanced: [{ torch: _flashOn }] });
      const icon = document.getElementById("flashIcon");
      if (icon) icon.classList.toggle("active", _flashOn);
    } catch(e) {
      console.error("Flash error:", e);
    }
  }

  // -- Zoom --
  let _zoomTrack = null;
  let _zoomMin = 1, _zoomMax = 5;

  function applyZoom(val) {
    if (!_zoomTrack) return;
    const label = document.getElementById("zoomLabel");
    if (label) label.textContent = parseFloat(val).toFixed(1) + "x";
    try {
      _zoomTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] });
    } catch(e) {}
  }

  // -- Gallery scan --
  function openGallery() {
    document.getElementById("galleryInput").click();
  }

  function scanFromGallery(event) {
    const file = event.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width  = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      // Try BarcodeDetector first
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        detector.detect(img).then(codes => {
          if (codes.length > 0) {
            handleScannedUrl(codes[0].rawValue);
          } else {
            tryJsQROnImageData(imageData);
          }
        }).catch(() => tryJsQROnImageData(imageData));
      } else {
        tryJsQROnImageData(imageData);
      }
    };
    img.src = url;
    event.target.value = "";
  }

  function tryJsQROnImageData(imageData) {
    if (typeof jsQR !== "undefined") {
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) { handleScannedUrl(code.data); return; }
    }
    // Load jsQR and retry
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    script.onload = () => {
      // Re-draw since we need the image data fresh
      const msg = document.getElementById("scanMsg");
      if (msg) { msg.textContent = "No QR code found in image"; setTimeout(() => msg.textContent = "", 2500); }
    };
    document.head.appendChild(script);
  }

  function loadJsQR(video) {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    script.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      _scanInterval = setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) { closeScanner(); handleScannedUrl(code.data); }
        }
      }, 300);
    };
    document.head.appendChild(script);
  }

  function closeScanner() { stopInlineScanner(); }

  function handleScannedUrl(raw) {
    // If it's a full URL containing ?code=, extract and navigate
    if (raw.includes("?code=") || raw.includes("&code=")) {
      window.location.href = raw;
    } else {
      // Treat raw value as the code directly
      window.location.href = window.location.pathname + "?code=" + encodeURIComponent(raw);
    }
  }

  document.addEventListener("change", e => {
    if (e.target.id === "worker") localStorage.setItem("worker", e.target.value);
  });

  window.addEventListener("DOMContentLoaded", async () => {
    const code = new URLSearchParams(window.location.search).get("code") || "";
    setUsedWasteState(0);

    if (!code) {
      // -- No code - show scanner and open camera immediately --
      document.getElementById("scanHome").style.display      = "flex";
      preloadProducts();
      preloadWorkers();
      // Start inline camera - show retry button if permission not yet granted
      startInlineScanner();
      return;
    }

    // -- Has code - show product screen --
    sessionStorage.setItem("lastScanUrl", window.location.href);
    document.getElementById("scanHome").style.display      = "none";
    document.getElementById("productScreen").style.display = "flex";
    document.getElementById("productScreen").style.flexDirection = "column";

    // Show cached product data instantly
    const cached = sessionStorage.getItem("productMap");
    if (cached) {
      try { PRODUCT_MAP = JSON.parse(cached); showProduct(); } catch(e) {}
    }

    // Load all in parallel
    const [, , mepData] = await Promise.allSettled([
      preloadProducts().then(() => showProduct()),
      preloadWorkers(),
      fetch(`${API_URL}?action=mepStatus&code=${encodeURIComponent(code)}`, { cache: "no-store" }).then(r => r.json()),
    ]);

    if (mepData?.status === "fulfilled" && mepData.value) {
      updateMepUI(mepData.value);
    }
  });

  // -- OFFLINE SCAN QUEUE - IndexedDB + auto-retry --
  const DB_NAME    = "mep-offline";
  const DB_VERSION = 1;
  const STORE      = "scans";
  let   _db        = null;

  // Open / create the IndexedDB
  function openDB() {
    return new Promise((resolve, reject) => {
      if (_db) { resolve(_db); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        }
      };
      req.onsuccess = e => { _db = e.target.result; resolve(_db); };
      req.onerror   = e => reject(e.target.error);
    });
  }

  // Save a scan to the queue
  async function queueScan(scan) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, "readwrite");
        const req = tx.objectStore(STORE).add(scan);
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    } catch(e) {
      console.error("IndexedDB queue failed:", e);
    }
  }

  // Get all queued scans
  async function getQueue() {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror   = () => reject(req.error);
      });
    } catch(e) { return []; }
  }

  // Delete a queued scan by id after successful sync
  async function deleteQueued(id) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, "readwrite");
        const req = tx.objectStore(STORE).delete(id);
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    } catch(e) {}
  }

  // Update the pending badge count
  async function updateBadge() {
    const queue = await getQueue();
    const badge = document.getElementById("offlineBadge");
    const count = document.getElementById("offlineCount");
    if (!badge || !count) return;
    if (queue.length > 0) {
      count.textContent = queue.length;
      badge.classList.add("visible");
    } else {
      badge.classList.remove("visible");
    }
  }

  // Retry all queued scans - called when back online or badge tapped
  async function retryQueue() {
    const queue = await getQueue();
    if (queue.length === 0) return;

    showMsg("Syncing " + queue.length + " offline scan(s)...", "info");
    let synced = 0;
    let failed = 0;

    for (const scan of queue) {
      try {
        const url = `${API_URL}?code=${encodeURIComponent(scan.code)}&worker=${encodeURIComponent(scan.worker)}&action=${encodeURIComponent(scan.action)}`;
        const res = await fetch(url);
        if (res.ok) {
          await deleteQueued(scan.id);
          synced++;
        } else {
          failed++;
        }
      } catch(e) {
        failed++;
      }
    }

    await updateBadge();
    if (failed === 0) {
      showMsg("All " + synced + " scan(s) synced OK", "success");
    } else {
      showMsg(synced + " synced, " + failed + " still pending", "info");
    }
  }

  // Auto-retry when browser comes back online
  window.addEventListener("online", () => {
    retryQueue();
  });

  // Check queue on page load and show badge if pending
  document.addEventListener("change", e => {
    if (e.target.id === "worker") localStorage.setItem("worker", e.target.value);
  });

  window.addEventListener("DOMContentLoaded", () => {
    updateBadge();
    // Also retry immediately if online
    if (navigator.onLine) retryQueue();
  });

  // Register background sync with service worker (retry even when page closed)
  async function registerBackgroundSync() {
    if ("serviceWorker" in navigator && "SyncManager" in window) {
      try {
        const reg = await navigator.serviceWorker.ready;
        await reg.sync.register("retry-scans");
      } catch(e) {}
    }
  }

  // Listen for sync-complete message from service worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", e => {
      if (e.data?.type === "SYNC_COMPLETE") {
        retryQueue();
      }
    });
  }



  // ── PIN pad ──────────────────────────────────────────────────
  



</script>
</body>
