<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.product {
  font-size: 36px;
  font-weight: bold;
  margin: 25px 0;
}

select {
  font-size: 20px;
  padding: 10px;
  width: 80%;
  margin-bottom: 25px;
}

button {
  width: 90%;
  font-size: 26px;
  padding: 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  color: white;
}

.produce { background: #ff9800; }
.done { background: #4CAF50; }
.waste { background: #f44336; }

.message {
  font-size: 30px;
  margin-top: 40px;
}

/* Success animation */
#msg.success {
  animation: pop 0.4s ease-out;
}

@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div id="product" class="product"></div>

<select id="worker"></select>

<!-- SOUND -->
<audio id="beep" preload="auto">
  <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<button class="produce" onclick="send('produce')">Produce</button>
<button class="done" onclick="send('done')">Finished</button>
<button class="waste" onclick="send('waste')">Waste</button>

<div id="msg" class="message"></div>
