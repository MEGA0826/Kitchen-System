<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">

  <!-- Register service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

  <!-- Inline CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .title { font-size: 34px; font-weight: bold; margin-top: 10px; }
    .subtitle { font-size: 22px; color: #555; margin-bottom: 25px; }
    .product-image {
      width: 170px; height: 170px; object-fit: cover;
      border-radius: 12px; margin-bottom: 15px; display: none;
    }
    .product { font-size: 32px; font-weight: bold; margin-bottom: 20px; }
    select {
      font-size: 20px; padding: 10px; width: 80%;
      margin-bottom: 25px; border-radius: 8px;
    }
    button {
      width: 90%; font-size: 26px; padding: 20px;
      margin: 10px; border: none; border-radius: 12px; color: white;
    }
    .produce { background: #ff9800; }
    .done    { background: #4CAF50; }
    .waste   { background: #f44336; }
    .cancel  { background: #9e9e9e; }
    .message { font-size: 26px; margin-top: 20px; }
  </style>
</head>

<body>

<h1 class="title">Kitchen MEP System</h1>
<h2 class="subtitle">212 : Nooch Richti</h2>

<img id="productImage" class="product-image" loading="lazy">
<div id="product" class="product">Loading...</div>

<select id="worker">
