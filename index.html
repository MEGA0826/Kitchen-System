<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen MEP — 212 Nooch Richti</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen MEP">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#0f0f0d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="i18n.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").then(reg => {
        // Check for updates every time the page loads
        reg.update();
        // When a new SW is waiting, reload to activate it
        reg.addEventListener("updatefound", () => {
          const newSW = reg.installing;
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              // New version available - reload silently
              window.location.reload();
            }
          });
        });
      });
      // Listen for sync complete messages from SW
      navigator.serviceWorker.addEventListener("message", e => {
        if (e.data?.type === "SYNC_COMPLETE") console.log("Background sync complete");
      });
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0d;
      --surface:   #1a1a16;
      --surface2:  #242420;
      --border:    rgba(255,255,255,0.08);
      --border2:   rgba(255,255,255,0.14);
      --text:      #f0ede6;
      --muted:     #888880;
      --amber:     #e8a020;
      --amber-dim: rgba(232,160,32,0.12);
      --amber-brd: rgba(232,160,32,0.25);
      --green:     #5dca8a;
      --green-dim: rgba(93,202,138,0.12);
      --green-brd: rgba(93,202,138,0.20);
      --red:       #e86050;
      --red-dim:   rgba(232,96,80,0.12);
      --red-brd:   rgba(232,96,80,0.20);
      --blue:      #60a8e8;
      --blue-dim:  rgba(96,168,232,0.12);
      --blue-brd:  rgba(96,168,232,0.22);
      --gray-dim:  rgba(255,255,255,0.06);
      --radius:    14px;
      --radius-sm: 8px;
    }
    [data-theme="light"] {
      --bg:        #f5f4ef;
      --surface:   #ffffff;
      --surface2:  #eeecea;
      --border:    rgba(0,0,0,0.08);
      --border2:   rgba(0,0,0,0.15);
      --text:      #1a1a14;
      --muted:     #77776e;
    }
/* 
    ── STAFF HOME MEP LIST ── */
    .home-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      z-index: 10;
    }
    .home-hamburger {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .home-hamburger span {
      display: block;
      width: 22px;
      height: 3px;
      border-radius: 2px;
    }
    .home-hamburger span:nth-child(1) { background: #4ade80; }
    .home-hamburger span:nth-child(2) { background: #facc15; }
    .home-hamburger span:nth-child(3) { background: #f87171; }
    .home-scan-btn {
      background: rgba(232,160,32,0.18);
      color: #e8a020;
      border: 1px solid rgba(232,160,32,0.4);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .mep-split {
      display: flex;
      gap: 8px;
      padding: 8px;
      flex: 1;
      overflow: hidden;
    }
    .mep-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mep-col-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 4px 6px;
      text-align: center;
    }
    .mep-col-title.produce { color: #facc15; }
    .mep-col-title.avail   { color: #4ade80; }
    .mep-col-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 24px;
      scrollbar-width: thin;
      scrollbar-color: rgba(232,160,32,0.3) transparent;
    }
    .mep-col-scroll::-webkit-scrollbar { width: 3px; }
    .mep-col-scroll::-webkit-scrollbar-track { background: transparent; }
    .mep-col-scroll::-webkit-scrollbar-thumb { background: rgba(232,160,32,0.35); border-radius: 2px; }
    .mep-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      min-height: 72px;
      background: #1a1a1a;
      border: 2px solid transparent;
      flex-shrink: 0;
    }
    .mep-card.hl-red    { border-color: #f87171; }
    .mep-card.hl-yellow { border-color: #facc15; }
    .mep-card.hl-green  { border-color: #4ade80; }
    .mep-card.hl-blue   { border-color: #60a5fa; }
    .mep-card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
    }
   .mep-card-ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      opacity: 0.12;
    }
    .mep-card-body {
      position: relative;
      z-index: 2;
      padding: 6px 6px 0;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.0) 100%);
    }
    .mep-card-hl {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      z-index: 1;
      opacity: 0.12;
    }
    .mep-card.hl-red    .mep-card-hl { background: #f87171; }
    .mep-card.hl-yellow .mep-card-hl { background: #facc15; }
    .mep-card.hl-green  .mep-card-hl { background: #4ade80; }
    .mep-card.hl-blue   .mep-card-hl { background: #60a5fa; }
    .mep-card-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      word-break: break-word;
    }
    .mep-bar-wrap {
      position: relative;
      height: 7px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      margin: 5px 0 0;
      overflow: hidden;
    }
    .mep-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s;
    }
    .mep-card.hl-red    .mep-bar-fill { background: #f87171; }
    .mep-card.hl-yellow .mep-bar-fill { background: #facc15; }
    .mep-card.hl-green  .mep-bar-fill { background: #4ade80; }
    .mep-card.hl-blue   .mep-bar-fill { background: #60a5fa; }
    .mep-bar-label {
      font-size: 10px;
      color: rgba(255,255,255,0.9);
      text-align: right;
      padding: 1px 0 4px;
    }

    /* Submenu drawer */
    .role-drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 220px;
      background: #111;
      border-right: 1px solid #2a2a2a;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      padding: 56px 0 24px;
    }
    .role-drawer.open { transform: translateX(0); }
    .role-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 299;
      display: none;
    }
    .role-drawer-overlay.open { display: block; }
    .role-drawer-title {
      font-size: 10px;
      letter-spacing: 2px;
      color: #555;
      text-transform: uppercase;
      padding: 0 20px 12px;
    }
    .role-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: none;
      border: none;
      color: #ccc;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      width: 100%;
      border-bottom: 1px solid #1e1e1e;
    }
    .role-btn:hover { background: #1a1a1a; color: #fff; }
    .role-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Role PIN modal */
    .role-pin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .role-pin-modal.active { display: flex; }
    .role-pin-box {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px 24px 20px;
      width: 88%;
      max-width: 320px;
    }
    .role-pin-title {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
      color: #fff;
    }
    .role-pin-sub {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }
    .role-pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .role-pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid #444;
      background: transparent;
      transition: all 0.15s;
    }
    .role-pin-dot.filled { background: #e8a020; border-color: #e8a020; }
    .role-pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .role-pin-key {
      padding: 16px 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.1s;
    }
    .role-pin-key:active { background: #2a2a2a; transform: scale(0.96); }
    .role-pin-msg { font-size: 12px; color: #f87171; text-align: center; min-height: 18px; margin-bottom: 10px; }
    .role-pin-cancel {
      width: 100%;
      padding: 11px;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #555;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* MEP popup (click card) */
    .mep-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 350;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .mep-popup.active { display: flex; }
    .mep-popup-box {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px 16px 0 0;
      padding: 20px 18px 32px;
      width: 100%;
      max-width: 480px;
    }
    .mep-popup-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .mep-popup-ph {
      width: 100%;
      height: 120px;
      background: #1e1e1e;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 12px;
    }
    .mep-popup-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .mep-popup-stats {
      display: flex;
      gap: 10px;
      margin: 10px 0 14px;
      flex-wrap: wrap;
    }
    .mep-popup-stat {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e1e1e;
      color: #aaa;
    }
    .mep-popup-allergy {
      font-size: 13px;
      margin-bottom: 14px;
      color: #888;
    }
    .mep-popup-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .mep-popup-btn {
      padding: 14px 4px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .mep-popup-btn.done  { background: #166534; color: #4ade80; }
    .mep-popup-btn.used  { background: #1e3a5f; color: #60a5fa; }
    .mep-popup-btn.waste { background: #4c1d1d; color: #f87171; }
    .mep-popup-close {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #555;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* -- Page: fills screen, no scroll -- */
    .page {
      height: 100vh; height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* -- Header -- */
    .header {
      padding: 12px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-name {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      line-height: 1;
    }
    .brand-name em { font-style: italic; color: var(--amber); }
    .brand-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dashboard-link {
      font-size: 8px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 8px;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      transition: color .15s, border-color .15s;
    }
    .dashboard-link:hover { color: var(--amber); border-color: var(--amber); }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--green);
      letter-spacing: 0.5px;
    }
     .live-badge-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
      .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2.4s ease-in-out infinite;
    }
      .live-time { 
      font-size: 10px; color: var(--muted); letter-spacing: 0.5px; font-family: var(--mono); 
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* -- Product Card -- */
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      flex-shrink: 0;
      animation: slideUp .3s ease both;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }
    /* Top row: text left, image right - image never overlaps text */
    .product-top {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .product-info {
      flex: 1;
      min-width: 0; /* allows text-overflow to work */
    }
    .product-label {
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .product-name {
      font-family: 'Instrument Serif', serif;
      font-size: 30px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-code {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 1px;
    }
    /* Image - fixed size beside text, never absolute */
    .product-img {
      width: 140px;
      height: 105px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .product-img-ph {
      width: 140px;
      height: 105px;
      border-radius: 10px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      opacity: .25;
      flex-shrink: 0;
    }
      .product-select-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .product-select-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .product-select {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      appearance: none;
      cursor: pointer;
    }

    /* -- MEP Status rows -- */
    .mep-status {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mep-row {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .mep-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .mep-dot.green { background: var(--green); }
    .mep-dot.amber { background: var(--amber); }
    .mep-dot.red   { background: var(--red); }
    .mep-row-label {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mep-row-label strong {
      color: var(--text);
      font-weight: 500;
    }
    .mep-row-label.full strong { color: var(--green); }

    /* Full MEP list message inside actions grid */
    .mep-full-msg {
      display: none;
      grid-column: 1 / -1;
      background: var(--green-dim);
      border: 1px solid var(--green-brd);
      color: var(--green);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      font-size: 15px;
      letter-spacing: 0.5px;
       margin-bottom: 12px;
    }
    .mep-full-msg.visible { display: block; }

    /* -- Worker Select + PIN -- */
    .field-wrap { flex-shrink: 0; animation: slideUp .3s .07s ease both; }


    /* -- Action Buttons - compact row -- */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      animation: slideUp .3s .14s ease both;
    }
    .btn-row { display: flex; gap: 7px; }
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      transition: transform .1s, opacity .12s;
      flex: 1;
    }
    .btn:active { transform: scale(0.97); }
    .btn-icon  { font-size: 24px; line-height: 1; flex-shrink:0; }
    .btn-label { font-size: 18px; letter-spacing: 0.8px; }

    .btn-done  { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-brd); }
    .btn-used  { background: var(--blue-dim);  color: var(--blue);  border: 1px solid var(--blue-brd); }
    .btn-waste { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red-brd); }

    .btn-undo {
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber-brd);
      border-radius: var(--radius-sm);
      padding: 0 16px;
      height: 42px;
      animation: pulse 1s ease-in-out infinite;
      width: 100%;
    }
    .btn-undo .btn-icon { font-size: 17px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    /* Inactive state for all action buttons */
    .btn.inactive {
      opacity: 0.28;
      pointer-events: none;
    }

    /* -- Offline queue badge -- */
    .offline-badge {
      display: none;
      position: fixed;
      top: 12px; right: 12px;
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber-brd);
      border-radius: 20px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      z-index: 50;
      cursor: pointer;
      animation: pulse 2s ease-in-out infinite;
    }
    .offline-badge.visible { display: block; }

    /* -- Status row (feedback + undo share same slot) -- */
    .status-row {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .feedback-inner {
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border-radius: 40px;
      display: none;
      width: 100%;
      justify-content: center;
    }
    .feedback-inner.visible { display: inline-flex; align-items: center; gap: 6px; }
    .feedback-inner.success { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-brd); }
    .feedback-inner.error   { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red-brd); }
    .feedback-inner.info    { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber-brd); }

    /* -- Over-produce popup -- */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .popup-overlay.visible { display: flex; }
    .popup-box {
      background: var(--surface);
      border: 1px solid var(--red-brd);
      border-radius: var(--radius);
      padding: 24px 22px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      animation: slideUp .25s ease both;
    }
    .popup-icon { font-size: 32px; margin-bottom: 10px; }
    .popup-title { font-family: 'Instrument Serif', serif; font-size: 22px; color: var(--red); margin-bottom: 6px; }
    .popup-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .popup-btn { width: 100%; padding: 12px; background: var(--red-dim); color: var(--red); border: 1px solid var(--red-brd); border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity .15s; }
    .popup-btn:active { opacity: 0.7; }

    /* -- Skeleton -- */
    .skeleton {
      height: 26px; width: 55%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--surface2) 25%, #2e2e28 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    /* -- QRbot-style full-screen scanner -- */
    .scan-home {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    /* Video fills everything */
    .scan-home-video-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    #scanner-video-inline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Dark vignette overlay - 4 panels around transparent box */
    .scan-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    /* The centred transparent scan frame */
    .scan-frame-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      z-index: 3;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.52);
      border-radius: 12px;
    }
    /* Corner brackets */
    .scan-c {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #e8a020;
      border-style: solid;
    }
    .scan-c.tl { top:-2px;  left:-2px;  border-width:4px 0 0 4px; border-radius:8px 0 0 0; }
    .scan-c.tr { top:-2px;  right:-2px; border-width:4px 4px 0 0; border-radius:0 8px 0 0; }
    .scan-c.bl { bottom:-2px; left:-2px;  border-width:0 0 4px 4px; border-radius:0 0 0 8px; }
    .scan-c.br { bottom:-2px; right:-2px; border-width:0 4px 4px 0; border-radius:0 0 8px 0; }
    /* Animated scan line inside frame */
    .scan-line {
      position: absolute;
      left: 4px; right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e8a020, transparent);
      box-shadow: 0 0 6px 2px rgba(232,160,32,0.6);
      border-radius: 2px;
      animation: scanmove 2s ease-in-out infinite;
    }
    @keyframes scanmove {
      0%   { top: 4px;  opacity:0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: calc(100% - 6px); opacity:0; }
    }
    /* Hint below frame */
    .scan-hint-text {
      position: absolute;
      top: calc(50% + 120px);
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 4;
      pointer-events: none;
    }
    /* Top bar */
    .scan-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      padding: 0 16px;
    }
    .scan-app-name {
      font-family: 'Instrument Serif', serif;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    /* Zoom slider */
    .scan-zoom-wrap {
      position: absolute;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.45);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .scan-zoom-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      min-width: 30px;
      text-align: center;
    }
    #zoomSlider {
      -webkit-appearance: none;
      width: 140px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      outline: none;
    }
    #zoomSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #e8a020;
      cursor: pointer;
      border: 2px solid #fff;
    }
    /* Bottom toolbar */
    .scan-toolbar {
      height: 96px;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 5;
    }
    .scan-tb-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 12px;
      transition: background .15s;
      min-width: 60px;
    }
    .scan-tb-btn:active { background: rgba(255,255,255,0.12); }
    .scan-tb-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15);
      transition: background .15s, border-color .15s;
    }
    .scan-tb-icon.active { background: #e8a020; border-color: #e8a020; }
    .scan-tb-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    /* Retry button */
    .btn-scan-camera {
      position: absolute;
      bottom: 110px;
      left: 50%; transform: translateX(-50%);
      z-index: 6;
      padding: 12px 28px;
      background: rgba(232,160,32,0.9);
      color: #000;
      border: none;
      border-radius: 24px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scan-msg {
      position: absolute;
      top: 64px; left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,100,80,0.9);
      z-index: 6;
      padding: 0 24px;
    }
    /* Hidden file input for gallery */
    #galleryInput { display: none; }
    .btn-scan-camera {
      padding: 14px;
      background: var(--amber-dim);
      color: var(--amber);
      border: 1px solid var(--amber-brd);
      border-radius: var(--radius);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: opacity .15s;
    }
    .btn-scan-camera:active { opacity: 0.7; }
    .scan-msg { font-size:12px; color:var(--red); text-align:center; min-height:18px; }

    /* -- PIN Pad -- */
    .pin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .pin-name { font-size:13px; color:var(--amber); font-family:'DM Mono',monospace; letter-spacing:0.5px; }
    .pin-dots { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
    .pin-dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--border2); background:transparent; transition:background .1s, border-color .1s; }
    .pin-dot.filled { background:var(--amber); border-color:var(--amber); }
    .pin-dot.error  { background:var(--red);   border-color:var(--red); }
    .pin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .pin-btn { padding:13px 0; background:var(--surface); color:var(--text); border:1px solid var(--border2); border-radius:var(--radius-sm); font-family:'DM Mono',monospace; font-size:18px; font-weight:500; cursor:pointer; transition:background .1s, transform .08s; -webkit-tap-highlight-color:transparent; }
    .pin-btn:active { background:var(--surface2); transform:scale(0.94); }
    .pin-clear { color:var(--muted); font-size:13px; }
    .pin-del   { color:var(--amber); font-size:15px; }

    /* ── MEP Homepage List ── */
    .mep-home-list { display:flex; flex-direction:column; gap:0; }
    .mep-cat-title {
      font-size:10px; letter-spacing:2px; text-transform:uppercase;
      color:var(--muted); padding:16px 0 6px; border-bottom:1px solid var(--border2);
      margin-bottom:2px;
    }
    .mep-home-row {
      display:flex; align-items:center; gap:12px;
      padding:10px 0; border-bottom:1px solid var(--border2);
      cursor:pointer;
    }
    .mep-home-thumb {
      width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0;
    }
    .mep-home-thumb-ph {
      width:52px; height:52px; border-radius:8px; background:var(--surface2);
      display:flex; align-items:center; justify-content:center;
      font-size:20px; flex-shrink:0; color:var(--muted);
    }
    .mep-home-info { flex:1; min-width:0; }
    .mep-home-name {
      font-size:15px; font-weight:500; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .mep-home-sub { font-size:12px; color:var(--muted); margin-top:2px; }
    .mep-home-expiry { font-size:11px; margin-top:2px; }
    .mep-home-bars { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
    .mep-bar-wrap { display:flex; align-items:center; gap:6px; }
    .mep-bar-label { font-size:10px; color:var(--muted); width:56px; flex-shrink:0; text-align:right; }
    .mep-bar-track { flex:1; height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
    .mep-bar-fill  { height:100%; border-radius:3px; transition:width .3s; }
    .mep-bar-val   { font-size:11px; font-weight:600; width:22px; text-align:right; flex-shrink:0; }
    .mep-status-dot {
      width:10px; height:10px; border-radius:50%; flex-shrink:0;
      box-shadow:0 0 0 2px var(--surface);
    }
  </style>
</head>
<body>

  <!-- Offline queue badge -->
  <div class="offline-badge" id="offlineBadge" onclick="retryQueue()" title="Tap to retry pending scans">
     <span id="offlineCount">0</span> pending
  </div>

  <!-- Scanner home state - inline camera, no overlay needed -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
</style>
 
  <!-- Staff Home: default landing page -->
  <div id="staffHome" style="display:none;flex-direction:column;overflow:hidden;background:#0d0d0d;height:100dvh;position:fixed;inset:0">
  
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;border-bottom:1px solid #1e1e1e">
    <!-- Hamburger button -->
      <button class="home-hamburger" onclick="openRoleDrawer()">
        <span></span><span></span><span></span>
      </button>
     <div style="text-align:center">
        <div style="font-family:'Instrument Serif',serif;font-size:32px;line-height:1;color:rgba(255,255,255,0.85)">Kitchen <em style="font-style:italic;color:#e8a020">MEP</em></div>
        <div id="homeLiveTime" style="font-size:13px;color:#888;font-family:var(--mono);letter-spacing:1px;margin-top:4px"></div>
      </div>
      <button class="home-scan-btn" onclick="openScanPage()">← Scan</button>
    </div>
    <!-- MEP Overview title -->
    <div style="padding:8px 14px 4px;border-bottom:1px solid #1e1e1e;flex-shrink:0">
      <div style="font-family:'Instrument Serif',serif;font-size:20px;color:rgba(255,255,255,0.85)">MEP <em style="font-style:italic;color:#e8a020">Overview</em></div>
      <div style="font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:2px">Today's production status</div>
    </div>

    <!-- MEP split -->
    <div class="mep-split" style="flex:1;min-height:0;overflow:hidden">
      <div class="mep-col" style="min-height:0">
        <div class="mep-col-title produce" onclick="cycleSortMode()" style="cursor:pointer;user-select:none">⚠ To Produce</div>
        <div class="mep-col-scroll" id="home-produce-list" style="-webkit-overflow-scrolling:touch">
          <div style="color:#444;font-size:11px;text-align:center;padding:16px">Loading…</div>
        </div>
      </div>
      <div style="width:1px;background:#222;flex-shrink:0;margin:24px 0 4px"></div>
      <div class="mep-col" style="min-height:0">
        <div class="mep-col-title avail" onclick="cycleSortModeAvail()" style="cursor:pointer;user-select:none">✓ Available</div>
        <div class="mep-col-scroll" id="home-avail-list" style="-webkit-overflow-scrolling:touch">
          <div style="color:#444;font-size:11px;text-align:center;padding:16px">Loading…</div>
        </div>
      </div>
    </div>
  </div>  
    
<div id="scanHome" style="display:none;flex-direction:column;position:relative;overflow:hidden;height:100vh;height:100dvh">

  <!-- Camera area fills remaining space -->
  <div class="scan-home-video-wrap" style="flex:1;min-height:180px;position:relative">
    <video id="scanner-video-inline" autoplay muted playsinline></video>
    <div class="scan-vignette"></div>
    <div class="scan-frame-box">
      <div class="scan-c tl"></div><div class="scan-c tr"></div>
      <div class="scan-c bl"></div><div class="scan-c br"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-hint-text">Hold QR code in frame</div>

    <!-- Header overlay on camera -->
    <div style="position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);padding:16px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="font-family:'Instrument Serif',serif;font-size:28px;line-height:1;color:rgba(255,255,255,0.85)">Kitchen <em style="font-style:italic;color:#e8a020">MEP</em></div>
      <button onclick="goToStaffHome()" style="background:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:rgba(255,255,255,0.6);font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 14px;cursor:pointer;margin-top:2px">⌂ Home</button>
    </div>

    <!-- Zoom slider -->
    <div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;width:60%">
      <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="4" step="0.1" value="1"
        oninput="applyZoom(this.value)" style="width:100%">
    </div>
  </div>

  <!-- Bottom toolbar -->
  <div class="scan-toolbar">
    <button class="scan-tb-btn" onclick="openGallery()">
      <div class="scan-tb-icon">🖼</div>
      <span class="scan-tb-label">Gallery</span>
    </button>
    <button class="scan-tb-btn" id="btnFlash" onclick="toggleFlash()">
      <div class="scan-tb-icon" id="flashIcon">⚡</div>
      <span class="scan-tb-label">Flash</span>
    </button>
    <button class="scan-tb-btn" id="btnToggleCamera" onclick="toggleCamera()">
      <div class="scan-tb-icon">⇄</div>
      <span class="scan-tb-label" id="btnToggleCameraLabel">Front</span>
    </button>
  </div>

  <input type="file" id="galleryInput" accept="image/*" onchange="scanFromGallery(event)" style="display:none">
  </div>

<!-- Product + Actions screen (shown after scan) -->
  <div id="productScreen" style="display:none;flex-direction:column;overflow:hidden;height:100vh;height:100dvh;background:#0d0d0d">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid #1e1e1e;flex-shrink:0">
      <button onclick="goToStaffHome()" style="background:none;border:1px solid #2a2a2a;border-radius:6px;color:#666;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;cursor:pointer">⌂ Home</button>
      <div style="font-family:'Instrument Serif',serif;font-size:22px;color:rgba(255,255,255,0.85)">Kitchen <em style="font-style:italic;color:#e8a020">MEP</em></div>
      <button onclick="goToScanHome()" style="background:none;border:1px solid #2a2a2a;border-radius:6px;color:#666;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;cursor:pointer">← Scan</button>
    </div>

   <!-- Product hero: fixed top half -->
    <div style="height:46vh;display:flex;flex-direction:column;align-items:center;padding:8px 16px 6px;gap:6px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-shrink:0">

      <!-- Image -->
      <div style="width:220px;height:220px;border-radius:16px;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <img id="productImage" alt="" style="display:none;width:100%;height:100%;object-fit:cover">

      <!-- Name -->

      <div id="productCode" style="font-size:11px;color:#444;font-family:var(--mono);text-align:center"></div>

      <!-- MEP info -->

          <span id="mepDotDone" style="width:10px;height:10px;border-radius:50%;background:#22c55e;flex-shrink:0"></span>
          <span id="mepLabelDone" style="font-size:14px;color:#ccc"></span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="mepDotList" style="width:10px;height:10px;border-radius:50%;background:#e8a020;flex-shrink:0"></span>
          <span id="mepLabelList" style="font-size:14px;color:#ccc"></span>
        </div>
      </div>

      <!-- Daily target covered -->
      <div id="mepFullMsg" style="font-size:14px;color:#22c55e;text-align:center;display:none"></div>

    </div>

    <!-- Spacer pushes actions to bottom half -->
    <div style="flex:0"></div>

    <!-- Worker + Actions pinned to bottom -->
    <div style="flex-shrink:0;padding:6px 14px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid #1e1e1e">

     <!-- Worker select -->
      <select id="worker" class="worker-select" onchange="localStorage.setItem('worker',this.value)"
        style="width:100%;padding:14px 16px;background:#141414;color:#ccc;border:1px solid #2a2a2a;border-radius:8px;font-family:var(--mono);font-size:16px;letter-spacing:0.5px;cursor:pointer">
        <option value="">-- Select staff member --</option>
      </select>

      <!-- Finish MEP -->
      <button class="btn btn-done" onclick="send('done')" style="width:100%;padding:11px;border-radius:8px;font-size:15px">
        <span class="btn-icon">✓</span>
        <span class="btn-label">Finish MEP</span>
      </button>

      <!-- Used + Waste -->
      <div style="display:flex;gap:8px">
        <button class="btn btn-used" id="btnUsed" onclick="send('used')" style="flex:1;padding:10px">
          <span class="btn-icon">→</span>
          <span class="btn-label">Used</span>
        </button>
        <button class="btn btn-waste" id="btnWaste" onclick="send('waste')" style="flex:1;padding:10px">
          <span class="btn-icon">✕</span>
          <span class="btn-label">Waste</span>
        </button>
      </div>

      <!-- Undo / feedback -->
      <div class="status-row" id="statusRow" style="min-height:36px;display:flex;align-items:center;justify-content:center">
        <div class="feedback-inner" id="msg"></div>
        <button class="btn btn-undo" id="btnUndo" onclick="undoAction()" style="display:none;width:100%">
          <span class="btn-icon">←</span>
          <span class="btn-label" id="undoLabel">Undo (3)</span>

<script>
 const API_URL = "https://script.google.com/macros/s/AKfycbz1aiIySe0-JwsLE4Vq8GyVwxS_7aRxyX48fvAWxP1cBeeOKFUK0w0mf7WCoe-9T8IHtQ/exec";

  let PRODUCT_MAP = {};
  let CURRENT_CODE = "";

function updateLiveTime() {
  const now  = new Date();
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const day  = days[now.getDay()];
  const dd   = String(now.getDate()).padStart(2,"0");
  const mm   = String(now.getMonth()+1).padStart(2,"0");
  const yy   = String(now.getFullYear()).slice(2);
  const hh   = String(now.getHours()).padStart(2,"0");
  const min  = String(now.getMinutes()).padStart(2,"0");
  const ss   = String(now.getSeconds()).padStart(2,"0");
  const combined = `${day} ${dd}.${mm}.${yy}  Time ${hh}:${min}:${ss}`;
  const el1 = document.getElementById("liveTime");
  const el2 = document.getElementById("liveTime2");
  if (el1) el1.textContent = combined;
  if (el2) el2.textContent = combined;
  const el3 = document.getElementById("homeLiveTime");
  if (el3) el3.textContent = combined;
}
  setInterval(updateLiveTime, 1000);
  updateLiveTime();

  // ✅ NEW: single-call MEP homepage list with category groups + shelf life
  async function loadMepHomeList() {
    const grid = document.getElementById("mepHomeGrid");
    if (!grid) return;

    // Show from cache instantly
    const cachedOv = sessionStorage.getItem("mepOverview");
    if (cachedOv) {

    try {
      // Single batch call — no N parallel requests

          PRODUCT_MAP[code] = p;

  function renderMepHomeList(products) {
    const grid = document.getElementById("mepHomeGrid");
    if (!grid) return;

    const today = new Date();
    const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    // Group by kategorie, sort categories alphabetically
    const groups = {};
    Object.entries(products).forEach(([code, p]) => {
      if (!p.mepMax && !p.tagesziel) return; // skip non-MEP products
      const cat = p.kategorie || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push({ code, ...p });
    });

    const sortedCats = Object.keys(groups).sort();
    if (!sortedCats.length) {
      grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:24px 0;text-align:center">No MEP products configured</div>`;
      return;
    }

    let html = "";
    sortedCats.forEach(cat => {
      html += `<div class="mep-cat-title">${cat}</div>`;
      // Sort by toProduce desc (most urgent first)
      groups[cat].sort((a, b) => (b.toProduce || 0) - (a.toProduce || 0));
      groups[cat].forEach(p => {
        const avail    = p.available   || 0;
        const toProd   = p.toProduce   || 0;
        const target   = p.tagesziel   || p.mepMax || 0;
        const maxBar   = target || 1;

        // Status dot color
        let dotColor = "var(--red)";
        if (avail >= target && target > 0) dotColor = "var(--green)";
        else if (avail > 0)                dotColor = "var(--amber)";

        // Shelf life / expiry badge from earliest batch
        let expiryHtml = "";
        if (p.batches && p.batches.length > 0) {
          // FIFO: first batch expires first
          const oldest    = p.batches.slice().sort((a, b) => a.expiryDate < b.expiryDate ? -1 : 1)[0];
          const expDate   = new Date(oldest.expiryDate + "T23:59:59");
          const diffMs    = expDate - today;
          const diffDays  = Math.ceil(diffMs / 86400000);
          const dayName   = dayNames[expDate.getDay()];
          const expStr    = oldest.expiryDate.slice(5).replace("-", "/"); // MM/DD
          if (diffDays <= 0) {
            expiryHtml = `<div class="mep-home-expiry" style="color:var(--red)">⚠ Expired — use or discard</div>`;
          } else if (diffDays <= 1) {
            expiryHtml = `<div class="mep-home-expiry" style="color:var(--amber)">⚠ Expires today (${dayName})</div>`;
          } else {
            expiryHtml = `<div class="mep-home-expiry" style="color:var(--muted)">Fridge until ${dayName} ${expStr} (+${diffDays}d)</div>`;
          }
        } else if (p.shelfLife) {
          expiryHtml = `<div class="mep-home-expiry" style="color:var(--muted)">Shelf life: +${p.shelfLife}d</div>`;
        }

        // Thumbnail
        const imgHtml = p.image
          ? `<img class="mep-home-thumb" src="${p.image}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            + `<div class="mep-home-thumb-ph" style="display:none">🍽</div>`
          : `<div class="mep-home-thumb-ph">🍽</div>`;

        // Bar: Available
        const availPct = Math.min(100, Math.round(avail / maxBar * 100));
        const prodPct  = Math.min(100, Math.round(toProd / maxBar * 100));
        const availColor = avail >= target && target > 0 ? "var(--green)" : avail > 0 ? "var(--amber)" : "var(--red)";
        const prodColor  = toProd > 0 ? "var(--amber)" : "var(--surface2)";

        html += `
          <div class="mep-home-row" onclick="window.location.href='?code=${encodeURIComponent(p.code)}'">
            <div class="mep-status-dot" style="background:${dotColor}"></div>
            ${imgHtml}
            <div class="mep-home-info">
              <div class="mep-home-name">${p.name}</div>
              ${expiryHtml}
            </div>
            <div class="mep-home-bars">
              <div class="mep-bar-wrap">
                <div class="mep-bar-label">Avail</div>
                <div class="mep-bar-track"><div class="mep-bar-fill" style="width:${availPct}%;background:${availColor}"></div></div>
                <div class="mep-bar-val" style="color:${availColor}">${avail}</div>
              </div>
              <div class="mep-bar-wrap">
                <div class="mep-bar-label">Produce</div>
                <div class="mep-bar-track"><div class="mep-bar-fill" style="width:${prodPct}%;background:${prodColor}"></div></div>
                <div class="mep-bar-val" style="color:${prodPct>0?'var(--amber)':'var(--muted)'}">${toProd}</div>
              </div>
            </div>
          </div>`;
      });
    });

    grid.innerHTML = html;
  }

  // -- MEP status --
  async function loadMepStatus(code) {
    if (!code) return;
    try {

  function setUsedWasteState(avail) {
    const noAvail = !avail || Number(avail) < 1;
    // Use id selectors - more reliable than class selectors when display:none parents exist
    const btnUsed  = document.getElementById("btnUsed");
    const btnWaste = document.getElementById("btnWaste");
    [btnUsed, btnWaste].forEach(btn => {
      if (!btn) return;
      if (noAvail) {
        btn.classList.add("inactive");
        btn.style.opacity = "0.28";
        btn.style.pointerEvents = "none";
      } else {
        btn.classList.remove("inactive");
        btn.style.opacity = "";
        btn.style.pointerEvents = "";
      }
    });
  }

function updateMepUI(data) {
    const status  = document.getElementById("mepStatus");
    const fullMsg = document.getElementById("mepFullMsg");

    // Always update Used/Waste state - even when mepMax is 0
    const _avail = data.available !== undefined ? data.available : (data.doneCount || 0);
    setUsedWasteState(_avail);
    if ((!data.mepMax || data.mepMax === 0) && (!data.tagesziel || data.tagesziel === 0)) {
      status.style.display = "none";
      fullMsg.classList.remove("visible");
      return;
    }
    status.style.display = "flex";
    const gnSize   = data.gnSize   || "";
    const gnWeight = data.gnWeight || 0;
    const inProg  = data.inProgress !== undefined
      ? data.inProgress
      : Math.max(0, (data.produceCount||0) - (data.doneCount||0));
    const avail   = data.available !== undefined
      ? data.available
      : (data.doneCount || 0);
    const listWt  = gnWeight * inProg;
    const availWt = gnWeight * avail;
    const labelDone = document.getElementById("mepLabelDone");
    const dotDone   = document.getElementById("mepDotDone");
    let doneText = `<strong>Available: ${avail}`;
    if (gnSize)   doneText += ` ${gnSize}`;
    if (gnWeight) doneText += ` = ${availWt} kg`;
    doneText += `</strong>`;
    labelDone.innerHTML = doneText;
    dotDone.className   = "mep-dot green";
    const tagesziel2 = data.tagesziel || 0;
    const mepMax2 = data.mepMax || 0;
    const targetQtyCalc = tagesziel2 > 0 ? tagesziel2 : mepMax2;
    const toProduce = targetQtyCalc > 0 ? Math.max(0, targetQtyCalc - avail) : inProg;
    const toProdWt = gnWeight * toProduce;
    const labelList = document.getElementById("mepLabelList");
    const dotList = document.getElementById("mepDotList");
    let listText = `<strong>To produce: ${toProduce}`;
    if (gnSize) listText += ` ${gnSize}`;
    if (gnWeight && toProduce > 0) listText += ` = ${toProdWt} kg`;
    listText += `</strong>`;
    labelList.innerHTML = listText;
    const btnDone = document.querySelector(".btn-done");
    if (btnDone) {
      const canFinish = inProg > 0 || toProduce > 0;
      if (canFinish) {
        btnDone.classList.remove("inactive");
        btnDone.title = "";
      } else {
        btnDone.classList.add("inactive");
        btnDone.title = "Nothing in MEP list to finish";
      }
    }
    window._lastAvail = avail;
    window._lastInProg = inProg;
    const tagesziel = data.tagesziel || 0;
    const mepMax = data.mepMax || 0;
    const targetQty = tagesziel > 0 ? tagesziel : mepMax;
    const covered = targetQty > 0 && avail >= targetQty;
    if (covered) {
      dotList.className = "mep-dot green";
      labelList.classList.add("full");
      fullMsg.textContent = "Daily target covered ✓";
      fullMsg.style.display = "block";
    } else {
      dotList.className = toProduce > 0 ? "mep-dot amber" : "mep-dot green";
      labelList.classList.remove("full");
      fullMsg.style.display = "none";
    }
  }

  function getCurrentWorker() {
    return document.getElementById("worker")?.value || "";
  }

  let _lastAction  = null;   // last successfully saved action
  let _undoTimer   = null;   // countdown interval
  let _redirectTimer = null; // auto-redirect timeout

async function send(action) {
  const worker = getCurrentWorker();
  if (!worker) { showMsg("Enter your PIN or select staff first", "error"); return; }

  const p = PRODUCT_MAP[CURRENT_CODE] || {};
  if (p.mepMax || p.tagesziel) {
    const targetQty = p.tagesziel > 0 ? p.tagesziel : p.mepMax;
    let newAvail = window._lastAvail || 0;
    if (action === "done") newAvail += 1;
    if (action === "used" || action === "waste") newAvail = Math.max(0, newAvail - 1);
    const newToProduce = targetQty > 0 ? Math.max(0, targetQty - newAvail) : (window._lastInProg || 0);
    const labelDone = document.getElementById("mepLabelDone");
    const labelList = document.getElementById("mepLabelList");
    const dotList   = document.getElementById("mepDotList");
    const fullMsg   = document.getElementById("mepFullMsg");
    if (labelDone) {
      let t = `<strong>Available: ${newAvail}`;
      if (p.gnSize)   t += ` ${p.gnSize}`;
      if (p.gnWeight) t += ` = ${(newAvail * p.gnWeight).toFixed(1)} kg`;
      labelDone.innerHTML = t + `</strong>`;
    }
    if (labelList) {
      let t = `<strong>To produce: ${newToProduce}`;
      if (p.gnSize)                t += ` ${p.gnSize}`;
      if (p.gnWeight && newToProduce > 0) t += ` = ${(newToProduce * p.gnWeight).toFixed(1)} kg`;
      labelList.innerHTML = t + `</strong>`;
    }
    const covered = targetQty > 0 && newAvail >= targetQty;
    if (covered) {
      if (dotList)  dotList.className = "mep-dot green";
      if (labelList) labelList.classList.add("full");
      if (fullMsg)  { fullMsg.textContent = "Daily target covered ✓"; fullMsg.style.display = "block"; }
    } else {
      if (dotList)  dotList.className = newToProduce > 0 ? "mep-dot amber" : "mep-dot green";
      if (labelList) labelList.classList.remove("full");
      if (fullMsg)  fullMsg.style.display = "none";
    }
    window._lastAvail = newAvail;
  }

  showMsg("Saving...", "info");
  const url = `${API_URL}?code=${encodeURIComponent(CURRENT_CODE)}&worker=${encodeURIComponent(worker)}&action=${encodeURIComponent(action)}`;

  try {
    if (!navigator.onLine) throw new Error("offline");
    const res  = await fetch(url);
    const data = await res.json();
    if (data.error) { showMsg("Error: " + data.error, "error"); await loadMepStatus(CURRENT_CODE); return; }
    if (data.mepMax !== undefined) updateMepUI(data);
    const successLabels = { produce:"Production started", done:"Batch finished", waste:"Waste recorded", used:"Use recorded" };
    showMsg(successLabels[action] || "OK", "success");
    startUndo(action);
  } catch(err) {
    await queueScan({ code: CURRENT_CODE, worker, action });
    showMsg("Offline - queued for sync", "info");
    await updateBadge();
    startUndo(action);
  }
}

  function startUndo(action) {
    _lastAction = action;
    clearInterval(_undoTimer);
    clearTimeout(_redirectTimer);

    const btn   = document.getElementById("btnUndo");
    const label = document.getElementById("undoLabel");
    const msg   = document.getElementById("msg");

    // Hide feedback message, show undo in the same slot
    if (msg)   msg.className = "feedback-inner";
    if (btn)   btn.style.display = "flex";   // flex not grid - matches status-row
    let secs = 3;
    if (label) label.textContent = `Undo (${secs})`;

    _undoTimer = setInterval(() => {
      secs--;
      if (label) label.textContent = `Undo (${secs})`;
      if (secs <= 0) {
          clearInterval(_undoTimer);
          btn.style.display = "none";
          _lastAction = null;
          goToStaffHome();
        }
    }, 1000);
  }

  function undoAction() {
    if (!_lastAction) return;
    clearInterval(_undoTimer);
    clearTimeout(_redirectTimer);
    document.getElementById("btnUndo").style.display = "none";

    const worker = document.getElementById("worker").value;
    showMsg("Undoing...", "info");

    fetch(`${API_URL}?action=undoScan&code=${encodeURIComponent(CURRENT_CODE)}&worker=${encodeURIComponent(worker)}&lastAction=${encodeURIComponent(_lastAction)}`)
      .then(r => r.json())
      .then(data => {
        if (data.error) { showMsg("Undo failed: " + data.error, "error"); return; }
        _lastAction = null;
        showMsg("Undone OK", "success");
        // Reload MEP status then return to scanner after short delay
        loadMepStatus(CURRENT_CODE);
        setTimeout(() => {
          goToStaffHome();
        }, 1200);
      })
      .catch(() => showMsg("Network error - undo failed", "error"));
  }

  // -- QR Scanner - inline video in page --
  let _scanStream   = null;
  let _scanInterval = null;
  let _cameraFacing = localStorage.getItem("cameraFacing") || "environment";

  function toggleCamera() {
    _cameraFacing = _cameraFacing === "environment" ? "user" : "environment";
    localStorage.setItem("cameraFacing", _cameraFacing);
    stopInlineScanner();
    startInlineScanner();
  }

  function updateToggleLabel() {
    const lbl = document.getElementById("btnToggleCameraLabel");
    if (lbl) lbl.textContent = _cameraFacing === "user" ? "Rear cam" : "Front cam";
  }

  async function startCameraStream() {
    const video = document.getElementById("scanner-video");
    try {
      _scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: _cameraFacing, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = _scanStream;
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        _scanInterval = setInterval(async () => {
          try {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
              const raw = codes[0].rawValue;
              closeScanner();
              handleScannedUrl(raw);
            }
          } catch(e) {}
        }, 300);
      } else {
        closeScanner();
        const code = prompt("Enter product code manually:");
        if (code) handleScannedUrl(code.trim());
      }
    } catch(err) {
      closeScanner();
      showMsg("Camera access denied - check browser permissions", "error");
    }
  }

  function openScanner() { startInlineScanner(); }

  function startInlineScanner() {
    const video = document.getElementById("scanner-video-inline");
    const retry = document.getElementById("btnRetry");
    const msg   = document.getElementById("scanMsg");
    if (!video) return;
    if (msg) msg.textContent = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: _cameraFacing } })
    .then(async stream => {
      _scanStream = stream;
      video.srcObject = stream;
      video.play();

      // Hide retry, update camera label
      if (retry) retry.style.display = "none";
      updateToggleLabel();

      // Wire zoom slider
      try {
        const track = stream.getVideoTracks()[0];
        _zoomTrack  = track;
        const caps  = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) {
          const slider = document.getElementById("zoomSlider");
          const wrap   = document.getElementById("zoomWrap");
          const label  = document.getElementById("zoomLabel");
          if (slider) {
            slider.min   = caps.zoom.min;
            slider.max   = caps.zoom.max;
            slider.step  = (caps.zoom.max - caps.zoom.min) / 50;
            // Default to 2.8x (or max if device doesn't support that high)
            const defaultZoom = Math.min(2.8, caps.zoom.max);
            slider.value = defaultZoom;
            track.applyConstraints({ advanced: [{ zoom: defaultZoom }] }).catch(() => {});
          }
          if (label) label.textContent = Math.min(2.8, caps.zoom.max).toFixed(1) + "x";
          if (wrap)  wrap.style.display = "flex";
        }
      } catch(e) { /* zoom not available */ }

      // Start QR decoding
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        _scanInterval = setInterval(() => {
          if (video.readyState < 2) return;
          detector.detect(video).then(codes => {
            if (codes.length > 0) {
              stopInlineScanner();
              handleScannedUrl(codes[0].rawValue);
            }
          }).catch(() => {});
        }, 300);
      } else {
        loadJsQR(video);
      }
    })
    .catch(err => {
      if (retry) retry.style.display = "flex";
      if (msg) msg.textContent = err.name === "NotAllowedError"
        ? "Camera permission denied - tap Retry"
        : "Camera error: " + err.message;
    });
  }

  function stopInlineScanner() {
    clearInterval(_scanInterval);
    _flashOn = false;
    if (_scanStream) { _scanStream.getTracks().forEach(t => t.stop()); _scanStream = null; }
  }

  // -- Flashlight --
  let _flashOn = false;
  async function toggleFlash() {
    if (!_scanStream) return;
    const track = _scanStream.getVideoTracks()[0];
    if (!track) return;
    try {
      const caps = track.getCapabilities();
      if (!caps.torch) { 
        document.getElementById("scanMsg").textContent = "Flashlight not supported on this device";
        setTimeout(() => { document.getElementById("scanMsg").textContent = ""; }, 2000);
        return;
      }
      _flashOn = !_flashOn;
      await track.applyConstraints({ advanced: [{ torch: _flashOn }] });
      const icon = document.getElementById("flashIcon");
      if (icon) icon.classList.toggle("active", _flashOn);
    } catch(e) {

  // -- Zoom --
  let _zoomTrack = null;
  let _zoomMin = 1, _zoomMax = 5;

  function applyZoom(val) {
    if (!_zoomTrack) return;
    const label = document.getElementById("zoomLabel");
    if (label) label.textContent = parseFloat(val).toFixed(1) + "x";
    try {
      _zoomTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] });
    } catch(e) {}
  }

  // -- Gallery scan --
  function openGallery() {
    document.getElementById("galleryInput").click();
  }

  function scanFromGallery(event) {
    const file = event.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width  = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      // Try BarcodeDetector first
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        detector.detect(img).then(codes => {
          if (codes.length > 0) {
            handleScannedUrl(codes[0].rawValue);
          } else {
            tryJsQROnImageData(imageData);
          }
        }).catch(() => tryJsQROnImageData(imageData));
      } else {
        tryJsQROnImageData(imageData);
      }
    };
    img.src = url;
    event.target.value = "";
  }

  function tryJsQROnImageData(imageData) {
    if (typeof jsQR !== "undefined") {
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) { handleScannedUrl(code.data); return; }
    }
    // Load jsQR and retry
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    script.onload = () => {
      // Re-draw since we need the image data fresh
      const msg = document.getElementById("scanMsg");
      if (msg) { msg.textContent = "No QR code found in image"; setTimeout(() => msg.textContent = "", 2500); }
    };
    document.head.appendChild(script);
  }

  function loadJsQR(video) {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    script.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      _scanInterval = setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) { closeScanner(); handleScannedUrl(code.data); }
        }
      }, 300);
    };
    document.head.appendChild(script);
  }

  function closeScanner() { stopInlineScanner(); }

  function handleScannedUrl(raw) {
    // If it's a full URL containing ?code=, extract and navigate
    if (raw.includes("?code=") || raw.includes("&code=")) {
      window.location.href = raw;
    } else {
      // Treat raw value as the code directly
      window.location.href = window.location.pathname + "?code=" + encodeURIComponent(raw);
    }
  }

    if (cached) {

    }
    const [, , mepData] = await Promise.allSettled([
      preloadProducts().then(() => showProduct()),

    ]);

    if (mepData?.status === "fulfilled" && mepData.value) {
      updateMepUI(mepData.value);
    }
  });

  // -- OFFLINE SCAN QUEUE - IndexedDB + auto-retry --
  const DB_NAME    = "mep-offline";
  const DB_VERSION = 1;
  const STORE      = "scans";
  let   _db        = null;

  // Open / create the IndexedDB
  function openDB() {
    return new Promise((resolve, reject) => {
      if (_db) { resolve(_db); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        }
      };
      req.onsuccess = e => { _db = e.target.result; resolve(_db); };
      req.onerror   = e => reject(e.target.error);
    });
  }

  // Save a scan to the queue
  async function queueScan(scan) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, "readwrite");
        const req = tx.objectStore(STORE).add(scan);
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    } catch(e) {
      console.error("IndexedDB queue failed:", e);
    }
  }

  // Get all queued scans
  async function getQueue() {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror   = () => reject(req.error);
      });
    } catch(e) { return []; }
  }

  // Delete a queued scan by id after successful sync
  async function deleteQueued(id) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE, "readwrite");
        const req = tx.objectStore(STORE).delete(id);
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    } catch(e) {}
  }

  // Update the pending badge count
  async function updateBadge() {
    const queue = await getQueue();
    const badge = document.getElementById("offlineBadge");
    const count = document.getElementById("offlineCount");
    if (!badge || !count) return;
    if (queue.length > 0) {
      count.textContent = queue.length;
      badge.classList.add("visible");
    } else {
      badge.classList.remove("visible");
    }
  }

  // Retry all queued scans - called when back online or badge tapped
  async function retryQueue() {
    const queue = await getQueue();
    if (queue.length === 0) return;

    showMsg("Syncing " + queue.length + " offline scan(s)...", "info");
    let synced = 0;
    let failed = 0;

    for (const scan of queue) {
      try {
        const url = `${API_URL}?code=${encodeURIComponent(scan.code)}&worker=${encodeURIComponent(scan.worker)}&action=${encodeURIComponent(scan.action)}`;
        const res = await fetch(url);
        if (res.ok) {
          await deleteQueued(scan.id);
          synced++;
        } else {
          failed++;
        }
      } catch(e) {
        failed++;
      }
    }

    await updateBadge();
    if (failed === 0) {
      showMsg("All " + synced + " scan(s) synced OK", "success");
    } else {
      showMsg(synced + " synced, " + failed + " still pending", "info");
    }
  }

  // Auto-retry when browser comes back online
  window.addEventListener("online", () => {
    retryQueue();
  });

  // Check queue on page load and show badge if pending
  window.addEventListener("DOMContentLoaded", () => {
    updateBadge();
    // Also retry immediately if online
    if (navigator.onLine) retryQueue();
  });

  // Register background sync with service worker (retry even when page closed)
  async function registerBackgroundSync() {
    if ("serviceWorker" in navigator && "SyncManager" in window) {
      try {
        const reg = await navigator.serviceWorker.ready;
        await reg.sync.register("retry-scans");
      } catch(e) {}
    }
  }

  // Listen for sync-complete message from service worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", e => {
      if (e.data?.type === "SYNC_COMPLETE") {
        retryQueue();
      }
    });
  }



  // -- PIN pad --------------------------------------------------
  

// ── MEP HOME LIST ──────────────────────────────────────────────────────────
  let _homeMepData   = {};
  let _rolePins      = {};
 let _sortMode      = 'priority';
  let _sortModeAvail = 'priority';
  const _sortModes   = ['priority','az','colour'];
  const _sortLabels        = { priority:'⚠ To Produce', az:'⚠ To Produce  A→Z', colour:'⚠ To Produce  🎨' };
  const _sortLabelsAvail   = { priority:'✓ Available',  az:'✓ Available  A→Z',  colour:'✓ Available  🎨' };
  let _pendingRole   = "";
  let _rolePinEntry  = "";
  let _popupCode     = "";

  const ALLERGY_ICONS = {
    nuts:"🥜", gluten:"🌾", fish:"🐟", milk:"🥛", dairy:"🥛",
    eggs:"🥚", soy:"🫘", celery:"🌿", mustard:"🌭", sesame:"🌱",
    shellfish:"🦐", sulphites:"🍷", lupin:"🫘"
  };

  function allergyIcons(str) {
    if (!str) return "";
    return str.split(",").map(a => {
      const k = a.trim().toLowerCase();
      return ALLERGY_ICONS[k] ? `${ALLERGY_ICONS[k]} ${a.trim()}` : a.trim();
    }).join("  ");
  }

  function hlClass(avail, target) {
    if (!target || target === 0) return "";
    if (avail > target)              return "hl-blue";
    if (avail === target)            return "hl-green";
    if (avail >= target * 0.3)       return "hl-yellow";
    return "hl-red";
  }

  function cycleSortMode() {
    const idx = _sortModes.indexOf(_sortMode);
    _sortMode = _sortModes[(idx + 1) % _sortModes.length];
    document.querySelector('.mep-col-title.produce').textContent = _sortLabels[_sortMode];
    renderHomeMep();
  }
  function cycleSortModeAvail() {
    const idx = _sortModes.indexOf(_sortModeAvail);
    _sortModeAvail = _sortModes[(idx + 1) % _sortModes.length];
    document.querySelector('.mep-col-title.avail').textContent = _sortLabelsAvail[_sortModeAvail];
    renderHomeMep();
  }

  function sortEntries(entries, mode) {
    if (mode === 'az') return entries.sort((a,b) => a[1].name.localeCompare(b[1].name));
    if (mode === 'colour') {
      const rank = e => ({'hl-red':0,'hl-yellow':1,'hl-green':2,'hl-blue':3}[hlClass(e[1].avail,e[1].target)] ?? 0);
      return entries.sort((a,b) => rank(a)-rank(b));
    }
    return entries.sort((a,b) => (a[1].priority||99)-(b[1].priority||99));
  }

function renderHomeMep() {
  const allEntries = Object.entries(_homeMepData);

  const produceEntries = allEntries.filter(([,d]) => (d.toProduce || 0) > 0);
  const availEntries   = allEntries.filter(([,d]) => (d.avail     || 0) > 0);

  function sortCol(entries, mode) {
    const copy = [...entries];
    if (mode === 'az') return copy.sort((a,b) => a[1].name.localeCompare(b[1].name));
    if (mode === 'colour') {
      const rank = ([,d]) => {
        const a = d.avail||0, t = d.target||1;
        if (a > t)  return 4;  // blue  — over target
        if (a === t) return 3; // green — exactly met
        if (a >= t*0.3) return 2; // amber — partial
        if (a > 0)  return 1;  // red   — low
        return 0;              // red   — none
      };
      return copy.sort((a,b) => rank(b) - rank(a)); // highest first
    }
    return copy.sort((a,b) => (b[1].toProduce||0) - (a[1].toProduce||0) || (a[1].priority||99) - (b[1].priority||99));
  }

  // Group entries by kategorie, preserving sort order within each group
  function groupByKat(entries) {
    const groups = {};
    entries.forEach(e => {
      const cat = e[1].kategorie || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(e);
    });
    return groups;
  }

  function formatQty(val, d) {
    const gnSize   = d.gnSize   || "";
    const gnWeight = d.gnWeight || 0;
    let str = `${val}`;
    if (gnSize)              str += ` ${gnSize}`;
    if (gnWeight && val > 0) str += ` (${(val * gnWeight).toFixed(1)} kg)`;
    return str;
  }

  const makeCard = (isProduce) => ([code, d]) => {
    const avail  = d.avail    || 0;
    const target = d.target   || d.mepMax || 1;
    const toProd = d.toProduce !== undefined ? Math.max(0, d.toProduce) : Math.max(0, target - avail);
    const pct    = Math.min(100, Math.round(avail / target * 100));
    const barColor = avail > target ? "var(--blue)" : avail === target ? "var(--green)" : avail > 0 ? "var(--amber)" : "var(--red)";

    const displayVal = isProduce ? toProd : avail;
    const qtyLabel   = formatQty(displayVal, d);

    const imgHtml = d.image
      ? `<img src="${d.image}" loading="lazy" style="width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`
      : `<div style="width:80px;height:80px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">🍽</div>`;

    return `
      <div onclick="openMepPopup('${code}')" style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #1e1e1e;cursor:pointer;align-items:flex-start">
        ${imgHtml}
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</div>
          <div style="height:5px;background:#2a2a2a;border-radius:3px;overflow:hidden;margin-bottom:6px">
            <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .3s"></div>
          </div>
          <div style="font-size:15px;font-weight:700;color:${barColor}">${qtyLabel}</div>
        </div>
      </div>`;
  };

  function renderCol(entries, mode, isProduce, elId) {
    const sorted = sortCol(entries, mode);
    const groups = groupByKat(sorted);
    const cats   = Object.keys(groups).sort();
    if (!cats.length) {
      document.getElementById(elId).innerHTML =
        `<div style="color:#444;font-size:11px;text-align:center;padding:16px">${isProduce ? "All done ✓" : "Nothing available yet"}</div>`;
      return;
    }
    let html = "";
    cats.forEach(cat => {
      html += `<div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#555;padding:10px 0 4px">${cat}</div>`;
      html += groups[cat].map(makeCard(isProduce)).join("");
    });
    document.getElementById(elId).innerHTML = html;
  }

  renderCol(produceEntries, _sortMode,      true,  "home-produce-list");
  renderCol(availEntries,   _sortModeAvail, false, "home-avail-list");
}

async function loadHomeMepStatus() {
    try {
      // ✅ Single batch call instead of N+1 parallel requests
      const res  = await fetch(`${API_URL}?action=getMepOverview`, { cache: "no-store" });
      const data = await res.json();
      if (!data || !data.products) return;

      // Populate PRODUCT_MAP for instant product screen load
      Object.entries(data.products).forEach(([code, p]) => { PRODUCT_MAP[code] = p; });
      try { sessionStorage.setItem("productMap", JSON.stringify(PRODUCT_MAP)); } catch(e) {}

      // Build _homeMepData using same fields as before — renderHomeMep() unchanged
      _homeMepData = {};

        _homeMepData[code] = {
          name    : p.name      || code,
          image   : p.image     || "",
          allergy : p.allergy   || "",

          avail   : Number(p.available   || 0),

          batches   : p.batches || [],
          toProduce : Number(p.toProduce || 0),
          kategorie : p.kategorie || "",
        };
      });
      renderHomeMep();
    } catch(e) { console.error("loadHomeMepStatus", e); }
  }

async function checkRolePin() {

      ? workers.find(w => typeof w === 'object' && String(w.pin) === String(pin) && w.active !== false && w.pin !== "")

    if (matched) {
      document.getElementById("rolePinMsg").textContent = "";

      `<span class="mep-popup-stat">Available: <b style="color:${statusColor}">${d.avail}</b></span>
       <span class="mep-popup-stat">Target: ${d.target}</span>
       <span class="mep-popup-stat">Max: ${d.mepMax} ${d.gnSize}</span>`;

    const allergyStr = allergyIcons(d.allergy);
    document.getElementById("mepPopupAllergy").innerHTML = allergyStr
      ? `Allergens: ${allergyStr}` : "";

    // Populate worker select from global list
    const dst = document.getElementById("popupWorker");
    const workers = window._homeWorkerList || [];
    dst.innerHTML = `<option value="">-- Select worker --</option>` +
      workers.map(w => {
        const name = typeof w === 'object' ? w.name : w;
        return `<option value="${name}">${name}</option>`;
      }).join('');
    const saved = localStorage.getItem("worker");
    if (saved) dst.value = saved;

    document.getElementById("mepPopup").classList.add("active");
  }

  function closeMepPopup() {
    document.getElementById("mepPopup").classList.remove("active");
    _popupCode = "";
  }

async function popupSend(action) {
    const worker = document.getElementById("popupWorker").value;
    if (!worker) { alert("Select a worker first"); return; }
    localStorage.setItem("worker", worker);

    const code = _popupCode;
    const d    = _homeMepData[code];
    if (!d) return;

    // Optimistic update
    if (action === "done")  d.avail = Math.min(d.mepMax, d.avail + 1);
    if (action === "used")  d.avail = Math.max(0, d.avail - 1);
    if (action === "waste") d.avail = Math.max(0, d.avail - 1);

    // Update popup stats live without closing
    const hl = hlClass(d.avail, d.target);
    const sc = {'hl-red':'#f87171','hl-yellow':'#facc15','hl-green':'#4ade80','hl-blue':'#60a5fa'}[hl] || '#aaa';
    document.getElementById("mepPopupStats").innerHTML =
      `<span class="mep-popup-stat">Available: <b style="color:${sc}">${d.avail}</b></span>
       <span class="mep-popup-stat">Target: ${d.target}</span>
       <span class="mep-popup-stat">Max: ${d.mepMax} ${d.gnSize}</span>`;
    renderHomeMep();

    // Send to server — same URL pattern as scan page send()
    try {
      await fetch(`${API_URL}?code=${encodeURIComponent(code)}&worker=${encodeURIComponent(worker)}&action=${encodeURIComponent(action)}`, { cache: "no-store" });
    } catch(e) { console.error("popupSend error", e); }

    // Refresh from server after delay — update background cards but keep popup open
    setTimeout(async () => {
      await loadHomeMepStatus();
      // Re-sync popup with fresh server data
      const d2 = _homeMepData[code];
      if (d2 && document.getElementById("mepPopup").classList.contains("active")) {
        const hl2 = hlClass(d2.avail, d2.target);
        const sc2 = {'hl-red':'#f87171','hl-yellow':'#facc15','hl-green':'#4ade80','hl-blue':'#60a5fa'}[hl2] || '#aaa';
        document.getElementById("mepPopupStats").innerHTML =
          `<span class="mep-popup-stat">Available: <b style="color:${sc2}">${d2.avail}</b></span>
           <span class="mep-popup-stat">Target: ${d2.target}</span>
           <span class="mep-popup-stat">Max: ${d2.mepMax} ${d2.gnSize}</span>`;
        // Update worker select in case list reloaded
const saved = localStorage.getItem("worker");
        if (saved) document.getElementById("popupWorker").value = saved;
      }
    }, 2000);
  }
</div>
