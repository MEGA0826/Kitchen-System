<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen MEP — 212 Nooch Richti</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kitchen MEP">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").then(reg => {
        reg.update();
        reg.addEventListener("updatefound", () => {
          const newSW = reg.installing;
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      });
      navigator.serviceWorker.addEventListener("message", e => {
        if (e.data?.type === "SYNC_COMPLETE") console.log("Background sync complete");
      });
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0d; --surface: #1a1a16; --surface2: #242420;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #f0ede6; --muted: #888880;
      --amber: #e8a020; --amber-dim: rgba(232,160,32,0.12); --amber-brd: rgba(232,160,32,0.25);
      --green: #5dca8a; --green-dim: rgba(93,202,138,0.12); --green-brd: rgba(93,202,138,0.20);
      --red: #e86050; --red-dim: rgba(232,96,80,0.12); --red-brd: rgba(232,96,80,0.20);
      --blue: #60a8e8; --blue-dim: rgba(96,168,232,0.12); --blue-brd: rgba(96,168,232,0.22);
      --gray-dim: rgba(255,255,255,0.06); --radius: 14px; --radius-sm: 8px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; -webkit-font-smoothing: antialiased; }
    .page { height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px; }
    .header { padding: 12px 0 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .brand-name { font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1; }
    .brand-name em { font-style: italic; color: var(--amber); }
    .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .dashboard-link, .scanner-link { font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 1px; text-transform: uppercase; padding: 4px 9px; border: 1px solid var(--border2); border-radius: var(--radius-sm); transition: color .15s, border-color .15s; cursor: pointer; background: none; }
    .dashboard-link:hover, .scanner-link:hover { color: var(--amber); border-color: var(--amber); }
    .live-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--green); letter-spacing: 0.5px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; flex-shrink: 0; animation: slideUp .3s ease both; display: flex; flex-direction: column; gap: 8px; }
    @keyframes slideUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .product-top { display: flex; gap: 12px; align-items: flex-start; }
    .product-info { flex: 1; min-width: 0; }
    .product-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .product-name { font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-code { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
    .product-img { width: 88px; height: 66px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .product-img-ph { width: 88px; height: 66px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: .25; flex-shrink: 0; }
    .mep-status { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    .mep-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
    .mep-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .mep-dot.green { background: var(--green); }
    .mep-dot.amber { background: var(--amber); }
    .mep-dot.red { background: var(--red); }
    .mep-row-label { font-size: 11px; color: var(--muted); letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mep-row-label strong { color: var(--text); font-weight: 500; }
    .mep-row-label.full strong { color: var(--green); }
    .mep-full-msg { display: none; grid-column: 1 / -1; background: var(--green-dim); border: 1px solid var(--green-brd); color: var(--green); border-radius: var(--radius); padding: 10px; text-align: center; font-size: 13px; letter-spacing: 0.5px; }
    .mep-full-msg.visible { display: block; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .btn { padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer; transition: all .15s; }
    .btn:hover { border-color: var(--amber); color: var(--text); }
    .btn.primary { background: var(--amber-dim); color: var(--amber); border-color: var(--amber-brd); }
    .btn.success { background: var(--green-dim); color: var(--green); border-color: var(--green-brd); }
    .btn.danger { background: var(--red-dim); color: var(--red); border-color: var(--red-brd); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .select { width: 100%; padding: 10px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 12px; }
    .product-screen-large { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto; }
    .product-screen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .stat-box-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .stat-box-value { font-family: 'Instrument Serif', serif; font-size: 36px; color: var(--text); line-height: 1; }
    .stat-box-value.amber { color: var(--amber); }
    .stat-box-value.green { color: var(--green); }
    .stat-box-value.red { color: var(--red); }
    .datetime-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
    .datetime-box .date { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
    .datetime-box .time { font-size: 18px; color: var(--text); font-weight: 500; margin-top: 4px; }
    .image-large { width: 100%; max-width: 100%; height: auto; border-radius: var(--radius); object-fit: cover; max-height: 200px; }
    .scanHome, .productScreen { display: none; }
    .scanner-container { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .video-container { flex: 1; background: #000; border-radius: var(--radius); overflow: hidden; position: relative; }
    #scannerVideo { width: 100%; height: 100%; object-fit: cover; }
    .overlay-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: var(--text); padding: 10px 16px; border-radius: 20px; font-size: 12px; text-align: center; }
    #scanMsg { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--surface); color: var(--text); padding: 20px 28px; border-radius: var(--radius); border: 1px solid var(--border); z-index: 200; text-align: center; min-width: 200px; }
    #scanMsg.visible { display: block; animation: slideUp .3s ease; }
  </style>
</head>
<body>

<!-- Main page wrapper -->
<div class="page" id="mainPage">
  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="brand-name">Kitchen <em>MEP</em></div>
      <div class="brand-sub">212 Nooch Richti</div>
    </div>
    <div class="header-right">
      <div id="liveIndicator" style="display:none;" class="live-badge">
        <span class="status-dot"></span>
        <span>LIVE</span>
      </div>
      <button id="scannerButton" class="scanner-link" style="display:none;">SCAN</button>
      <a href="dashboard.html" class="dashboard-link">DASH</a>
    </div>
  </div>

  <!-- SCAN HOME -->
  <div id="scanHome" class="scanHome">
    <div style="display:flex;flex-direction:column;gap:12px;flex:1">
      <div style="display:flex;gap:8px">
        <div style="flex:1">
          <label style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Worker</label>
          <select id="worker" class="select" style="font-size:12px">
            <option value="">-- Select worker --</option>
          </select>
        </div>
      </div>
      <div class="scanner-container">
        <div class="video-container">
          <video id="scannerVideo" playsinline></video>
          <div class="overlay-hint">Point at QR code</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="startInlineScanner()" class="btn primary" style="flex:1">Start Camera</button>
        <button id="uploadBtn" class="btn" style="flex:1">Upload Image</button>
        <input id="fileInput" type="file" accept="image/*" style="display:none">
      </div>
    </div>
    <div id="scanMsg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--border);z-index:200;text-align:center"></div>
  </div>

  <!-- PRODUCT SCREEN (LARGE) -->
  <div id="productScreen" class="productScreen" style="overflow-y:auto;flex:1;display:none;flex-direction:column">
    <div class="product-screen-large">
      <!-- Top: Product selector & date/time -->
      <div style="display:flex;gap:12px">
        <div style="flex:1">
          <label style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Product</label>
          <select id="productDropdown" class="select">
            <option value="">-- Select product --</option>
            <option value="OTHER">Other product</option>
          </select>
        </div>
        <div class="datetime-box" style="width:120px">
          <div class="date" id="currentDate">--/--</div>
          <div class="time" id="currentTime">--:--</div>
        </div>
      </div>

      <!-- Product info -->
      <div id="productInfo">
        <div class="stat-box">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <div class="stat-box-label">Available</div>
              <div class="stat-box-value green" id="availableCount">0</div>
            </div>
            <div>
              <div class="stat-box-label">To Produce</div>
              <div class="stat-box-value amber" id="toProduceCount">0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Large image -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center">
        <img id="productImageLarge" class="image-large" style="display:none">
        <div id="productImagePlaceholder" style="width:100%;height:200px;background:var(--surface2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px">No image</div>
      </div>

      <!-- Large action buttons -->
      <div>
        <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Action</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button onclick="scanAction('done')" class="btn success" id="btn-finish" style="padding:16px;font-size:13px">✓ Finish</button>
          <button onclick="scanAction('waste')" class="btn danger" id="btn-waste" style="padding:16px;font-size:13px">✗ Waste</button>
        </div>
      </div>

      <!-- Back button -->
      <button onclick="goBackToScanner()" class="btn" style="width:100%;padding:14px">Back to Scan</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/d/1aEMO3Hde7b6G7lRAPSyCMJgwMzY-4LCl6S2LXRSxh-FqzQcljqd1a1o5/usercache";
  let PRODUCT_MAP = {};
  let WORKERS = [];
  let _scanInterval = null;
  let _currentCode = null;

  // Date/Time update
  function updateDateTime() {
    const now = new Date();
    const dateStr = now.toLocaleDateString("de-CH", { weekday:"short", month:"2-digit", day:"2-digit" });
    const timeStr = now.toLocaleTimeString("en-US", { hour:"2-digit", minute:"2-digit", hour12:false });
    document.getElementById("currentDate").textContent = dateStr;
    document.getElementById("currentTime").textContent = timeStr;
  }

  async function preloadProducts() {
    try {
      const res = await fetch(`${API_URL}?action=allProducts`, { cache: "no-store" });
      PRODUCT_MAP = await res.json();
      sessionStorage.setItem("productMap", JSON.stringify(PRODUCT_MAP));
      populateProductDropdown();
    } catch(e) { console.error("preloadProducts:", e); }
  }

  async function preloadWorkers() {
    try {
      const res = await fetch(`${API_URL}?action=workers`, { cache: "no-store" });
      const data = await res.json();
      WORKERS = data.workers || [];
      const sel = document.getElementById("worker");
      if (sel) {
        const saved = localStorage.getItem("worker") || "";
        sel.innerHTML = '<option value="">-- Select worker --</option>';
        WORKERS.forEach(w => {
          const opt = document.createElement("option");
          opt.value = w;
          opt.textContent = w;
          if (w === saved) opt.selected = true;
          sel.appendChild(opt);
        });
      }
    } catch(e) { console.error("preloadWorkers:", e); }
  }

  function populateProductDropdown() {
    const sel = document.getElementById("productDropdown");
    if (!sel) return;
    sel.innerHTML = '<option value="">-- Select product --</option><option value="OTHER">Other product</option>';
    Object.keys(PRODUCT_MAP).sort().forEach(code => {
      const p = PRODUCT_MAP[code];
      const opt = document.createElement("option");
      opt.value = code;
      opt.textContent = p.name || code;
      sel.appendChild(opt);
    });
  }

  function showProduct() {
    const code = _currentCode;
    if (!code || !PRODUCT_MAP[code]) return;
    const p = PRODUCT_MAP[code];
    const img = document.getElementById("productImageLarge");
    if (p.image) {
      img.src = p.image;
      img.style.display = "block";
      document.getElementById("productImagePlaceholder").style.display = "none";
    } else {
      img.style.display = "none";
      document.getElementById("productImagePlaceholder").style.display = "flex";
    }
    document.getElementById("productDropdown").value = code;
  }

  async function updateMepUI(data) {
    document.getElementById("availableCount").textContent = data.available || 0;
    document.getElementById("toProduceCount").textContent = data.inProgress || 0;
  }

  async function scanAction(action) {
    const code = _currentCode || document.getElementById("productDropdown").value;
    const worker = document.getElementById("worker").value;
    if (!code || code === "OTHER") { showMsg("Select product", "error"); return; }
    if (!worker) { showMsg("Select worker", "error"); return; }

    try {
      const res = await fetch(`${API_URL}?code=${encodeURIComponent(code)}&worker=${encodeURIComponent(worker)}&action=${encodeURIComponent(action)}`);
      const data = await res.json();
      if (data.error) {
        showMsg(data.error, "error");
      } else {
        await updateMepUI(data);
        const labels = { done:"Finished ✓", waste:"Waste ✗" };
        showMsg(labels[action] || "Saved", "success");
        setTimeout(() => goBackToScanner(), 1200);
      }
    } catch(e) {
      showMsg("Error: " + e.message, "error");
    }
  }

  function goBackToScanner() {
    _currentCode = null;
    document.getElementById("scanHome").style.display = "flex";
    document.getElementById("productScreen").style.display = "none";
    window.history.replaceState({}, "", window.location.pathname);
  }

  function showMsg(text, type) {
    const el = document.getElementById("scanMsg");
    el.textContent = text;
    el.style.color = type === "error" ? "var(--red)" : type === "success" ? "var(--green)" : "var(--muted)";
    el.classList.add("visible");
    setTimeout(() => { el.classList.remove("visible"); }, 2500);
  }

  async function startInlineScanner() {
    try {
      const video = document.getElementById("scannerVideo");
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:"environment" } });
      video.srcObject = stream;
      document.getElementById("liveIndicator").style.display = "flex";
      loadJsQR(video);
    } catch(e) {
      showMsg("Camera not available", "error");
    }
  }

  function stopInlineScanner() {
    const video = document.getElementById("scannerVideo");
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
    }
    if (_scanInterval) { clearInterval(_scanInterval); _scanInterval = null; }
    document.getElementById("liveIndicator").style.display = "none";
  }

  document.getElementById("uploadBtn")?.addEventListener("click", () => {
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput")?.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      if ("BarcodeDetector" in window) {
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        detector.detect(img).then(codes => {
          if (codes.length > 0) {
            handleScannedUrl(codes[0].rawValue);
          } else {
            tryJsQROnImageData(imageData);
          }
        }).catch(() => tryJsQROnImageData(imageData));
      } else {
        tryJsQROnImageData(imageData);
      }
    };
    img.src = url;
    event.target.value = "";
  });

  function tryJsQROnImageData(imageData) {
    if (typeof jsQR !== "undefined") {
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) { handleScannedUrl(code.data); return; }
    }
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    script.onload = () => { showMsg("No QR code found", "error"); };
    document.head.appendChild(script);
  }

  function loadJsQR(video) {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    script.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      _scanInterval = setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) { stopInlineScanner(); handleScannedUrl(code.data); }
        }
      }, 300);
    };
    document.head.appendChild(script);
  }

  function handleScannedUrl(raw) {
    if (raw.includes("?code=") || raw.includes("&code=")) {
      window.location.href = raw;
    } else {
      window.location.href = window.location.pathname + "?code=" + encodeURIComponent(raw);
    }
  }

  document.addEventListener("change", e => {
    if (e.target.id === "worker") localStorage.setItem("worker", e.target.value);
  });

  window.addEventListener("DOMContentLoaded", async () => {
    const code = new URLSearchParams(window.location.search).get("code") || "";
    updateDateTime();
    setInterval(updateDateTime, 60000);

    if (!code) {
      document.getElementById("scanHome").style.display = "flex";
      preloadProducts();
      preloadWorkers();
      startInlineScanner();
      return;
    }

    _currentCode = code;
    sessionStorage.setItem("lastScanUrl", window.location.href);
    document.getElementById("scanHome").style.display = "none";
    document.getElementById("productScreen").style.display = "flex";

    const cached = sessionStorage.getItem("productMap");
    if (cached) {
      try { PRODUCT_MAP = JSON.parse(cached); showProduct(); } catch(e) {}
    }

    const [, , mepData] = await Promise.allSettled([
      preloadProducts().then(() => showProduct()),
      preloadWorkers(),
      fetch(`${API_URL}?action=mepStatus&code=${encodeURIComponent(code)}`, { cache: "no-store" }).then(r => r.json()),
    ]);

    if (mepData?.status === "fulfilled" && mepData.value) {
      await updateMepUI(mepData.value);
    }
  });

  // Offline queue functionality
  const DB_NAME = "mep-offline";
  const DB_VERSION = 1;
  const STORE = "scans";
  let _db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      if (_db) { resolve(_db); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        }
      };
      req.onsuccess = e => { _db = e.target.result; resolve(_db); };
      req.onerror = e => reject(e.target.error);
    });
  }

  window.addEventListener("online", () => {
    console.log("Back online");
  });
</script>
</body>
</html>
