name: Validate

# Static validation gate. Runs on every push and PR — there is no build step,
# so this is what stops a syntax error (like the stray brace it caught in
# i18n.js) from ever reaching GitHub Pages. Safe: no secrets, no deploy.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate HTML inline scripts, JS modules and service worker
        run: node scripts/validate.js
