<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Dashboard Test</title></head>
<body>
<h2 id="status">Loading...</h2>
<div id="output"></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbynCt3ykTwU7O6e4fdO2yLlyj75WCiL5-7QkP249BTA7MJdbl9AdY3RiBVetEn-dNs0Xg/exec";

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("status").textContent = "DOM ready - fetching...";
  
  fetch(API + "?action=workers")
    .then(r => r.json())
    .then(data => {
      document.getElementById("status").textContent = "SUCCESS";
      document.getElementById("output").innerHTML = 
        "<p>Workers: " + JSON.stringify(data.workers) + "</p>";
    })
    .catch(err => {
      document.getElementById("status").textContent = "ERROR: " + err.message;
    });
});
</script>
</body>
</html>
